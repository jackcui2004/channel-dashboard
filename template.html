<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三频道数据看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1115; --card:#1a1e26; --card2:#222834; --border:#2a3140;
  --text:#e8eaed; --muted:#9aa0ad; --accent:#5b9dff; --accent-dim:rgba(91,157,255,.12);
  --hot-bg:rgba(255,82,82,.14); --hot:#ff6b6b;
  --tag-bg:rgba(91,157,255,.14); --tag:#7db3ff;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px;max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:8px}
h1{font-size:26px;font-weight:700;letter-spacing:.5px}
.updated{color:var(--muted);font-size:13px;margin-bottom:20px}
.lang-btn{padding:8px 20px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:14px;transition:all .2s}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 20px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:15px;transition:all .2s}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.tab .count{opacity:.7;font-size:13px;margin-left:4px}
.controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search{flex:1;min-width:200px;padding:12px 16px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--card);color:var(--text)}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;border-color:var(--accent)}
.sortsel{padding:12px;border:1px solid var(--border);border-radius:12px;font-size:14px;background:var(--card);color:var(--text);cursor:pointer}
.sortsel:focus{outline:none;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat .num{font-size:24px;font-weight:700;color:var(--accent)}
.stat .label{font-size:12px;color:var(--muted);margin-top:4px}
.video{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;transition:border-color .2s}
.video:hover{border-color:#3a4358}
.video-header{padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.video-title{font-size:15px;font-weight:600;flex:1;line-height:1.5}
.video-meta{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.video-body{display:none;padding:0 20px 20px;border-top:1px solid var(--border)}
.video.open .video-body{display:block}
.video.open{border-color:var(--accent)}
.video.open .video-header{background:var(--accent-dim)}
.chevron{color:var(--muted);font-size:12px;transition:transform .2s;flex-shrink:0}
.video.open .chevron{transform:rotate(180deg)}
.detail{margin-top:12px;font-size:14px}
.detail-label{font-weight:600;color:var(--muted);margin-bottom:6px;font-size:13px}
.detail-value{background:var(--card2);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7}
.detail-value .translating{color:var(--muted);font-style:italic;font-size:12px}
.translated-tag{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{background:var(--tag-bg);color:var(--tag);border-radius:12px;padding:2px 10px;font-size:12px}
.comment{border-left:3px solid var(--border);padding:8px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0;font-size:13px}
.comment .author{font-weight:600;color:var(--accent);font-size:12px}
.comment .likes{color:var(--muted);font-size:11px;margin-left:8px}
.comment .ctime{color:var(--muted);font-size:11px;margin-left:8px}
.comment .reply{margin-top:8px;margin-left:12px;border-left:2px solid var(--accent);padding-left:10px}
.badge-hot{display:inline-block;font-size:12px;background:var(--hot-bg);color:var(--hot);border-radius:10px;padding:2px 10px;margin-left:8px;vertical-align:middle;font-weight:600}
.yt-link{display:inline-block;margin-top:4px;color:var(--accent);text-decoration:none;font-size:13px}
.yt-link:hover{text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:40px;font-size:14px}
footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center;line-height:1.8}
@media(max-width:640px){
  body{padding:12px}
  h1{font-size:20px}
  .video-header{padding:12px 14px;flex-direction:column;align-items:flex-start}
  .video-meta{white-space:normal}
  .video-body{padding:0 14px 14px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header>
  <h1 id="page-title">三频道数据看板</h1>
  <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
</header>
<div class="updated" id="updated-line">数据更新于 __UPDATED_AT__</div>

<div class="tabs" id="tabs"></div>

<div class="controls">
  <input class="search" id="search" placeholder="搜索标题…" oninput="applyFilter()">
  <select class="sortsel" id="sort" onchange="applyFilter()">
    <option value="published_desc">按发布时间 ↓</option>
    <option value="views_desc">按播放量 ↓</option>
    <option value="views_asc">按播放量 ↑</option>
  </select>
</div>

<div id="content"></div>

<footer id="footer-note">数据来自 YouTube 公开页面 · 每天自动更新 · 缺失数字标为「—」</footer>

<script>
const DATA = __DATA_JSON__;
let lang = localStorage.getItem('dash-lang') || 'zh';
let activeChannel = 0;

/* ---------- 翻译缓存：内存 + localStorage，按文本哈希存 ---------- */
const memCache = {};
const inflight = {};  // 并发请求合并
function hashStr(s){
  let h = 5381;
  for(let i=0;i<s.length;i++){ h = ((h<<5)+h+s.charCodeAt(i))|0; }
  return 'tr_'+(h>>>0).toString(36)+'_'+s.length;
}
function cacheGet(key){
  if(memCache[key]!==undefined) return memCache[key];
  try{
    const v = localStorage.getItem(key);
    if(v!==null){ memCache[key]=v; return v; }
  }catch(e){}
  return undefined;
}
function cacheSet(key,val){
  memCache[key]=val;
  try{ localStorage.setItem(key,val); }catch(e){/* 配额满则只留内存 */}
}

const I18N = {
  zh:{title:'三频道数据看板',subs:'订阅数',videos:'视频数',totalViews:'总播放',avgViews:'平均播放',
    searchPh:'搜索标题…',sortDate:'按发布时间 ↓',sortViewsD:'按播放量 ↓',sortViewsA:'按播放量 ↑',
    views:'播放',likes:'点赞',comments:'评论',published:'发布日期',
    desc:'简介',tags:'标签',commentsTitle:'评论精选',
    updated:'数据更新于',footer:'数据来自 YouTube 公开页面 · 每天自动更新 · 缺失数字标为「—」',
    noResult:'没有匹配的视频',translating:'正在翻译…',transFail:'翻译暂不可用，显示英文原文',
    translated:'已翻译',hot:'爆款',na:'—',btn:'EN'},
  en:{title:'3-Channel Dashboard',subs:'Subscribers',videos:'Videos',totalViews:'Total views',avgViews:'Avg views',
    searchPh:'Search titles…',sortDate:'Newest first',sortViewsD:'Most viewed',sortViewsA:'Least viewed',
    views:'views',likes:'likes',comments:'comments',published:'Published',
    desc:'Description',tags:'Tags',commentsTitle:'Top comments',
    updated:'Updated at',footer:'Data from public YouTube pages · auto-updated daily · missing numbers shown as "—"',
    noResult:'No matching videos',translating:'',transFail:'',translated:'',
    hot:'HOT',na:'—',btn:'中文'}
};
const T = () => I18N[lang];

function fmtNum(n){ return (n===null||n===undefined) ? T().na : Number(n).toLocaleString('en-US'); }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 翻译：Google gtx 主通道，MyMemory 兜底 ---------- */
async function translateText(text){
  if(!text || lang==='en') return null;
  const key = hashStr(text);
  const hit = cacheGet(key);
  if(hit!==undefined) return hit==='__FAIL__' ? null : hit;
  if(inflight[key]) return inflight[key];
  const p = (async()=>{
    // 分片：单次请求不超过 1800 字符
    const chunks=[]; let t=text;
    while(t.length>1800){ let i=t.lastIndexOf('\n',1800); if(i<0) i=1800; chunks.push(t.slice(0,i)); t=t.slice(i); }
    chunks.push(t);
    try{
      let out='';
      for(const c of chunks){
        const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(c);
        const r=await fetch(url); if(!r.ok) throw new Error('gtx '+r.status);
        const j=await r.json();
        out+=j[0].map(x=>x[0]).join('');
      }
      cacheSet(key,out); return out;
    }catch(e){
      try{
        const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair=en|zh-CN';
        const r=await fetch(url); if(!r.ok) throw new Error('mm '+r.status);
        const j=await r.json();
        if(j.responseData && j.responseData.translatedText){
          cacheSet(key,j.responseData.translatedText); return j.responseData.translatedText;
        }
      }catch(e2){}
      cacheSet(key,'__FAIL__'); return null;
    }finally{ delete inflight[key]; }
  })();
  inflight[key]=p; return p;
}

/* ---------- 渲染 ---------- */
function renderTabs(){
  document.getElementById('tabs').innerHTML = DATA.channels.map((c,i)=>
    `<button class="tab${i===activeChannel?' active':''}" onclick="switchChannel(${i})">${esc(c.name)}<span class="count">${c.videos.length}</span></button>`
  ).join('');
}

function channelStats(c){
  const vs=c.videos.filter(v=>typeof v.views==='number');
  const total=vs.reduce((a,v)=>a+v.views,0);
  const avg=vs.length?Math.round(total/vs.length):null;
  return {total: vs.length?total:null, avg};
}

function applyI18n(){
  const t=T();
  document.getElementById('page-title').textContent=t.title;
  document.getElementById('lang-btn').textContent=t.btn;
  document.getElementById('search').placeholder=t.searchPh;
  const s=document.getElementById('sort');
  s.options[0].text=t.sortDate; s.options[1].text=t.sortViewsD; s.options[2].text=t.sortViewsA;
  document.getElementById('updated-line').textContent=t.updated+' '+DATA.updated_at;
  document.getElementById('footer-note').textContent=t.footer;
  document.documentElement.lang = lang==='zh'?'zh-CN':'en';
  renderTabs(); renderList();
}

function toggleLang(){
  lang = lang==='zh' ? 'en' : 'zh';
  try{ localStorage.setItem('dash-lang',lang); }catch(e){}
  applyI18n();
}

function switchChannel(i){ activeChannel=i; renderTabs(); applyFilter(); }

function getFiltered(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const sort=document.getElementById('sort').value;
  let vs=DATA.channels[activeChannel].videos.filter(v=>(v.title||'').toLowerCase().includes(q));
  const key=(sort==='views_desc'||sort==='views_asc')?'views':'published';
  vs=vs.slice().sort((a,b)=>{
    const av=a[key], bv=b[key];
    if(av==null) return 1; if(bv==null) return -1;
    if(sort==='views_asc') return av-bv;
    return av<bv?1:av>bv?-1:0;
  });
  return vs;
}

function applyFilter(){ renderList(); }

function toggleVideo(header){
  const card=header.closest('.video');
  card.classList.toggle('open');
  maybeTranslate(card);
}

async function maybeTranslate(card){
  if(lang==='en'||!card.classList.contains('open')) return;
  const t=T();
  const els=card.querySelectorAll('[data-translate]');
  for(const el of els){
    if(el.dataset.done) continue;
    el.dataset.done='1';
    const orig=el.dataset.orig||'';
    if(!orig){ continue; }
    const note=document.createElement('div');
    note.className='translating'; note.textContent=t.translating;
    el.appendChild(note);
    const tr=await translateText(orig);
    note.remove();
    if(tr){
      el.innerHTML=esc(tr);
      if(t.translated){
        const tag=document.createElement('span');
        tag.className='translated-tag'; tag.textContent=t.translated;
        el.appendChild(tag);
      }
    }else if(t.transFail){
      const f=document.createElement('div'); f.className='translating'; f.textContent=t.transFail;
      el.appendChild(f);
    }
  }
}

function commentHtml(c){
  let h=`<div class="comment"><span class="author">${esc(c.author||'?')}</span><span class="likes">👍 ${fmtNum(c.likes)}</span>${c.time?`<span class="ctime">${esc(c.time)}</span>`:''}<div data-translate data-orig="${esc(c.text||'')}">${esc(c.text||'')}</div>`;
  for(const r of (c.replies||[])){
    h+=`<div class="reply"><span class="author">${esc(r.author||'?')}</span><span class="likes">👍 ${fmtNum(r.likes)}</span><div data-translate data-orig="${esc(r.text||'')}">${esc(r.text||'')}</div></div>`;
  }
  return h+'</div>';
}

function renderList(){
  const t=T();
  const vs=getFiltered();
  const box=document.getElementById('content');
  const c=DATA.channels[activeChannel];
  const st=channelStats(c);
  let html=`<div class="stats">
      <div class="stat"><div class="num">${fmtNum(c.subs)}</div><div class="label">${t.subs}</div></div>
      <div class="stat"><div class="num">${c.videos.length}</div><div class="label">${t.videos}</div></div>
      <div class="stat"><div class="num">${fmtNum(st.total)}</div><div class="label">${t.totalViews}</div></div>
      <div class="stat"><div class="num">${fmtNum(st.avg)}</div><div class="label">${t.avgViews}</div></div>
    </div>`;
  if(!vs.length){ box.innerHTML=html+`<div class="empty">${t.noResult}</div>`; return; }
  html+=vs.map(v=>{
    const hot=v.hot?`<span class="badge-hot">🔥 ${t.hot}</span>`:'';
    const parts=[`${fmtNum(v.views)} ${t.views}`,`👍 ${fmtNum(v.likes)}`,`💬 ${fmtNum(v.comments)}`];
    if(v.duration) parts.push(esc(v.duration));
    if(v.published) parts.push(esc(v.published));
    const meta=parts.join(' · ');
    let body=`<div class="detail"><a class="yt-link" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">▶ YouTube</a></div>`;
    body+=`<div class="detail"><div class="detail-label">${t.desc}</div><div class="detail-value" data-translate data-orig="${esc(v.description||'')}">${v.description?esc(v.description):t.na}</div></div>`;
    if(v.tags&&v.tags.length)
      body+=`<div class="detail"><div class="detail-label">${t.tags}</div><div class="tags">${v.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>`;
    if(v.comments_text&&v.comments_text.length)
      body+=`<div class="detail"><div class="detail-label">${t.commentsTitle} (${v.comments_text.length})</div>${v.comments_text.map(commentHtml).join('')}</div>`;
    return `<div class="video" data-vid="${esc(v.id)}">
      <div class="video-header" onclick="toggleVideo(this)">
        <div class="video-title">${esc(v.title||'(no title)')}${hot}</div>
        <div class="video-meta">${meta}</div>
        <span class="chevron">▼</span>
      </div>
      <div class="video-body">${body}</div>
    </div>`;
  }).join('');
  box.innerHTML=html;
}

applyI18n();
</script>
</body>
</html>
