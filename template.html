<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title>YouTube 数据看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f4; --card:#ffffff; --border:#e8e6e3;
  --text:#1a1a1a; --muted:#8a8a8a; --faint:#b5b5b5;
  --red:#d43d2a; --red-dark:#b83224;
  --tag-bg:#f0efed; --tag:#6b6b6b;
  --pill:#f0efed;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:16px 14px 110px;max-width:680px;margin:0 auto;-webkit-font-smoothing:antialiased}
.langicon{display:inline-block;min-width:44px;height:38px;border-radius:19px;padding:0 14px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.06);
  align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;user-select:none;color:var(--text)}
.langicon:active{transform:scale(.95)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.topbar h1{margin:0}
.glassbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:4px;padding:8px;
  background:rgba(255,255,255,.65);backdrop-filter:blur(24px) saturate(200%);-webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);border-radius:28px;
  box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.8);
  user-select:none;-webkit-user-select:none}
.glassbar .seg{position:relative;display:flex;background:rgba(0,0,0,.06);border-radius:20px;padding:3px;border:0}
.glassbar .seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:17px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:left .25s ease,width .25s ease;pointer-events:none}
.glassbar .seg button{position:relative;z-index:1;border:0;background:transparent;padding:9px 18px;border-radius:17px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.glassbar .seg button.on{color:var(--text);box-shadow:none;background:transparent}
.glassbar .refresh{border:0;background:transparent;padding:9px 16px;border-radius:17px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap}
.glassbar .refresh:active{background:rgba(0,0,0,.06)}
h1{font-size:24px;font-weight:800;text-align:center;letter-spacing:1px;margin:6px 0 10px}
.updated{color:var(--muted);font-size:13px;margin-bottom:12px}
.langrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:9px 22px;font-size:15px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:#1a1a1a;color:#fff}
.refresh-btn{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:9px 22px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text)}
.refresh-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.search{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--card);color:var(--text);margin-bottom:6px}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:#cfcfcf}
.tabs{display:flex;border-bottom:1px solid var(--border);margin:14px 0 4px}
.tab{flex:1;text-align:center;padding:12px 4px 10px;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;line-height:1.4}
.tab .n{font-size:15px}
.tab.on{color:var(--text);font-weight:800;border-bottom-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 6px;text-align:center}
.stat .num{font-size:24px;font-weight:800;letter-spacing:.3px}
.stat .label{font-size:12px;color:var(--muted);margin-top:4px}
.chanlink{color:var(--muted);font-size:13px;margin:2px 0 14px}
.chanlink a{color:var(--muted);text-decoration:underline}
.sortrow{display:flex;align-items:center;gap:10px;margin:6px 0 18px;flex-wrap:wrap}
.sortrow .cap{color:var(--muted);font-size:15px}
.sortpill{border:0;border-radius:20px;padding:8px 20px;font-size:15px;font-weight:600;cursor:pointer;background:var(--pill);color:var(--text)}
.sortpill.on{background:#1a1a1a;color:#fff}
.video{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 16px;margin-bottom:14px;position:relative}
.vtime{position:absolute;bottom:10px;right:14px;font-size:12px;color:var(--muted)}
/* 涨幅榜子标签 */
.ranksubtabs{display:flex;gap:8px;margin-bottom:14px}
.ranksubtab{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:6px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.ranksubtab.on{background:var(--text);color:var(--card);border-color:var(--text)}
.wordrow{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.wordrank{font-size:16px;font-weight:800;width:28px;color:var(--red)}
.wordrank.w1{color:#d4a017}.wordrank.w2{color:#888}.wordrank.w3{color:#b87333}
.wordtext{font-size:16px;font-weight:700;flex:1}
.wordviews{font-size:13px;color:var(--muted)}
.vhead{cursor:pointer}
.vtitle{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:21px;font-weight:800;line-height:1.5;margin-bottom:8px}
.badge-hot{display:inline-block;font-size:13px;background:var(--red);color:#fff;border-radius:8px;padding:3px 10px;margin-right:8px;font-weight:700;vertical-align:2px;font-family:-apple-system,"PingFang SC",sans-serif}
.badge-new{display:inline-block;font-size:13px;border-radius:8px;padding:3px 10px;margin-right:8px;font-weight:700;vertical-align:2px;font-family:-apple-system,"PingFang SC",sans-serif}
.badge-new.c-purple{background:#C724FF;color:#fff;box-shadow:0 0 4px rgba(199,36,255,.6)}
.badge-new.c-green{background:#39FF14;color:#000;box-shadow:0 0 4px rgba(57,255,20,.6)}
.badge-new.c-gray{background:#E8E8E8;color:#333;box-shadow:0 0 4px rgba(0,0,0,.15);border:1px solid #ccc}
.badge-new.c-red{background:#FF3131;color:#fff;box-shadow:0 0 4px rgba(255,49,49,.6)}
/* 频道 ID 底色（调灰版，低调区分） */
.chan-tag{display:inline-block;font-size:12.5px;border-radius:6px;padding:2px 10px;margin-bottom:6px;font-weight:600}
.chan-tag.c0{background:#E6D9F0;color:#5A3D7A}
.chan-tag.c1{background:#D9E8D9;color:#3D6B3D}
.chan-tag.c2{background:#E2E2E2;color:#555}
.chan-tag.c3{background:#F0D9D9;color:#7A3D3D}
.vmeta{font-size:14px;color:var(--muted);line-height:1.8}
.vmeta b{color:var(--text);font-weight:700}
.toggle{color:var(--red);font-weight:700;cursor:pointer;white-space:nowrap}
.vbody{display:none;margin-top:6px}
.video.open .vbody{display:block}
.dlabel{color:var(--muted);font-size:14px;margin:14px 0 6px}
.dtext{font-size:15.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.dtext .translating{color:var(--faint);font-size:13px}
.translated-tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:var(--tag-bg);color:var(--tag);border-radius:14px;padding:4px 14px;font-size:13.5px}
.note{color:var(--muted);font-size:13.5px;margin-top:12px;line-height:1.8}
.ctitle{color:var(--muted);font-size:14.5px;margin:16px 0 10px;font-weight:600}
.comment{margin:0 0 16px;font-size:15px}
.comment .chead{margin-bottom:4px}
.comment .author{font-weight:800}
.comment .clike{color:var(--muted);font-size:13.5px;margin-left:10px;font-weight:400}
.comment .ctext{line-height:1.8;word-break:break-word}
.comment .reply{margin:10px 0 0 6px;padding-left:14px;border-left:3px solid #e0dedb}
.comment .reply .ctext{line-height:1.8}
.ytwatch{display:inline-block;margin-top:14px;color:var(--red);font-size:16px;font-weight:600;text-decoration:underline}
.footer{margin-top:26px;color:var(--faint);font-size:12px;text-align:center;line-height:1.8}
.noresult{text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
.pageview{transition:transform .35s ease,opacity .35s ease;transform-origin:top center}
.pageview.hidden{display:none}
.pageview.flip-out{transform:perspective(1200px) rotateY(-18deg);opacity:0}
.pageview.flip-in{transform:perspective(1200px) rotateY(18deg);opacity:0}
.delta{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:#fdeceb;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.stat .delta{margin-left:0;margin-top:4px}
.viewseg{margin:6px 0 4px}
.rankcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.ranknum{font-size:22px;font-weight:800;color:var(--red);min-width:28px;text-align:center}
.ranknum.r1{color:#d43d2a}.ranknum.r2{color:#e0705a}.ranknum.r3{color:#e8a07a}
.rankinfo{flex:1;min-width:0}
.ranktitle{font-size:15px;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rankchan{font-size:12.5px;color:var(--muted);margin-top:2px}
.rankdelta{text-align:right;white-space:nowrap}
.rankdelta .d{font-size:18px;font-weight:800;color:var(--red)}
.rankdelta .l{font-size:11.5px;color:var(--muted)}
.rankhead{font-size:15px;font-weight:800;margin:14px 0 10px}
.rankhead .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
@media(max-width:480px){
  .vtitle{font-size:19px}
  .stat .num{font-size:20px}
  .stats{gap:8px}
  .stat{padding:12px 4px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
<h1 id="page-title">YouTube 数据看板</h1>
<div class="langicon" id="langicon" title="切换语言">中 / EN</div>
</div>
<div class="updated" id="updated-line">数据更新于 __UPDATED_AT__</div>
<input class="search" id="search" placeholder="🔍 搜索标题关键词...">
<div id="mainview" class="pageview">
<div class="tabs" id="tabs"></div>
<div id="list-controls">
<div class="stats" id="stats"></div>
<div class="chanlink" id="chanlink"></div>
<div class="sortrow" id="sortrow"></div>
</div>
<div id="list"></div>
</div>
<div id="rankview" class="pageview hidden">
  <div id="ranklist"></div>
</div>
<div class="footer" id="footer"></div>
<div class="glassbar" id="glassbar">
  <div class="seg" id="g-seg">
    <div class="thumb" id="g-thumb"></div>
    <button id="g-list" class="on">列表</button>
    <button id="g-rank">📈 涨幅榜</button>
  </div>
</div>
<script>
const DATA = __DATA_JSON__;
/* ---------- 语言 ---------- */
let lang = 'zh';
try{ lang = localStorage.getItem('dash-lang') || 'zh'; }catch(e){}
const T = {
zh:{updated:'数据更新于',refresh:'刷新数据',search:'🔍 搜索标题关键词...',subs:'订阅者',videos:'视频数',totalViews:'总播放量',avgViews:'平均播放/视频',openChan:'在 YouTube 打开频道',sort:'排序',latest:'最新发布',byViews:'播放量',plays:'播放',likes:'点赞',comments:'评论',duration:'时长',detail:'详情',collapse:'收起',desc:'简介',tags:'标签',note:'备注',commentsTitle:'评论',captured:(a,b)=>`（已抓取 ${a} 条 / 共 ${b} 条）`,watch:'在 YouTube 观看 →',likeWord:'赞',noResult:'没有匹配的视频',footer:'数据来自 YouTube 公开页面 · 每小时自动更新 · 缺失数字标为「—」',hot:'🔥 爆款',translating:'正在翻译…',transFail:'（翻译暂不可用，显示英文原文）',translated:'已翻译',refreshNote:'数据每小时自动更新',pageTitle:'YouTube 数据看板',listView:'视频列表',rankView:'📈 涨幅榜',rankTitle:'小时播放量涨幅榜',rankSub:'对比上一轮抓取',noDelta:'暂无上一轮数据',transTitle:'🌐 标题翻译',transTitleOn:'🌐 已翻译',isNew:'新发布',translatingTitle:'翻译中…',back:'← 返回',rankBtn:'📈 涨幅榜',expandAll:'展开查看全部 {n} 条 ▼',collapseAll:'收起 ▲',rankTabGrowth:'播放量涨幅',rankTabWords:'热词排行',wordVideos:'个视频'},
en:{updated:'Updated',refresh:'Refresh',search:'🔍 Search titles...',subs:'Subscribers',videos:'Videos',totalViews:'Total views',avgViews:'Avg views/video',openChan:'Open channel on YouTube',sort:'Sort',latest:'Newest',byViews:'Views',plays:'Views',likes:'Likes',comments:'Comments',duration:'Duration',detail:'Details',collapse:'Collapse',desc:'Description',tags:'Tags',note:'Note',commentsTitle:'Comments',captured:(a,b)=>`(${a} of ${b} captured)`,watch:'Watch on YouTube →',likeWord:'likes',noResult:'No matching videos',footer:'Data from public YouTube pages · auto-updated hourly · missing values shown as "—"',hot:'🔥 HOT',translating:'',transFail:'',translated:'',refreshNote:'Data auto-updates every hour',pageTitle:'YouTube Dashboard',listView:'Video List',rankView:'📈 Growth',rankTitle:'Hourly Growth Top 5',rankSub:'',noDelta:'No previous data yet',transTitle:'🌐 Translate Titles',transTitleOn:'🌐 Translated',isNew:'NEW',translatingTitle:'Translating…',back:'← Back',rankBtn:'📈 Growth',expandAll:'Show all {n} ▼',collapseAll:'Collapse ▲',rankTabGrowth:'View Growth',rankTabWords:'Hot Words',wordVideos:' videos'}};
const t = ()=>T[lang];
/* ---------- 翻译：内存 + localStorage 缓存，Google gtx 主通道，MyMemory 兜底 ---------- */
const memCache = {}, inflight = {};
function djb2(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}
function ckey(s){return 'tr_'+djb2(s)+'_'+s.length}
function cacheGet(k){if(memCache[k]!==undefined)return memCache[k];try{const v=localStorage.getItem(k);if(v!==null){memCache[k]=v;return v}}catch(e){}return undefined}
function cacheSet(k,v){memCache[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
async function translateText(text){
  if(!text||!text.trim())return text;
  const key=ckey(text);
  const hit=cacheGet(key);
  if(hit!==undefined)return hit==='__FAIL__'?'':hit;
  if(inflight[key])return inflight[key];
  const p=(async()=>{
    try{
      const chunks=[];let s=text;
      while(s.length>1800){let i=s.lastIndexOf('\n',1800);if(i<0)i=1800;chunks.push(s.slice(0,i));s=s.slice(i)}
      chunks.push(s);
      const out=[];
      for(const c of chunks){
        const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(c);
        const r=await fetch(url);if(!r.ok)throw new Error('gtx '+r.status);
        const j=await r.json();
        out.push((j[0]||[]).map(x=>x[0]||'').join(''));
      }
      const res=out.join('');cacheSet(key,res);return res;
    }catch(e){
      try{
        const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair=en|zh-CN';
        const r=await fetch(url);const j=await r.json();
        if(j.responseData&&j.responseData.translatedText){cacheSet(key,j.responseData.translatedText);return j.responseData.translatedText}
      }catch(e2){}
      cacheSet(key,'__FAIL__');return '';
    }finally{delete inflight[key]}
  })();
  inflight[key]=p;return p;
}
/* ---------- 工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtNum(v){return (v===null||v===undefined||isNaN(v))?'—':Number(v).toLocaleString('en-US')}
function fmtUpdated(s){
  if(!s||s==='—')return '—';
  const d=new Date(s);if(isNaN(d))return esc(s);
  const p=n=>n.toString().padStart(2,'0');
  const tz = lang==='zh' ? '（北京时间）' : ' (Beijing Time)';
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}${tz}`;
}
/* ---------- 状态 ---------- */
let curChan=-1, sortMode='latest', query='', curView='list', titleTransOn=false;
const openSet=new Set(), commentsOpen=new Set();
function chan(){return (DATA.channels||[])[curChan]||{videos:[]}}
/* ---------- 环比差值 ---------- */
function delta(v, key){
  const cur=v[key], prev=v['prev_'+key];
  if(cur==null||prev==null)return null;
  const d=cur-prev;
  return d;
}
function deltaHtml(v, key){
  const d=delta(v,key);
  if(d==null||d<=0)return '';
  return `<span class="delta">+${fmtNum(d)}</span>`;
}
function allVideosWithDelta(){
  const out=[];
  (DATA.channels||[]).forEach(c=>{
    (c.videos||[]).forEach(v=>{
      const d=delta(v,'views');
      if(d!=null&&d>0)out.push({v,chan:c.name,d,
        dl:delta(v,'likes'),dc:delta(v,'comments')});
    });
  });
  out.sort((a,b)=>b.d-a.d);
  return out;
}
let rankTab='growth';
const STOPWORDS=new Set(['my','the','a','an','and','or','to','of','in','on','for','with','as','at','by','is','was','are','were','be','been','it','its','this','that','these','those','i','you','he','she','we','they','me','him','her','us','them','his','hers','our','your','their','so','but','not','no','yes','do','does','did','will','would','can','could','should','has','have','had','from','up','out','about','into','over','after','before','between','through','during','under','again','once','here','there','when','where','why','how','what','which','who','whom','all','any','both','each','few','more','most','other','some','such','only','own','same','than','too','very','just','don','t','s','re','ve','ll','d','m']);
function hotWords(){
  const map={};
  (DATA.channels||[]).forEach(c=>{(c.videos||[]).forEach(v=>{
    const title=(v.title||'').toLowerCase().replace(/[^a-z0-9\s']/g,' ');
    const words=title.split(/\s+/).filter(w=>w.length>2&&!STOPWORDS.has(w));
    // 单词
    words.forEach(w=>{map[w]=map[w]||{views:0,count:0};map[w].views+=(v.views||0);map[w].count++});
    // 词组（2-gram）
    for(let i=0;i<words.length-1;i++){
      const phrase=words[i]+' '+words[i+1];
      map[phrase]=map[phrase]||{views:0,count:0};map[phrase].views+=(v.views||0);map[phrase].count++;
    }
  })});
  return Object.entries(map)
    .filter(([w,d])=>d.count>=2)
    .sort((a,b)=>b[1].views-a[1].views)
    .slice(0,20);
}
function renderRank(){
  const el=document.getElementById('ranklist');
  const hasPrev=!!DATA.prev_updated_at;
  let h=`<div class="rankhead">${t().rankTitle}<span class="sub">${t().rankSub}${hasPrev?' · '+fmtUpdated(DATA.prev_updated_at):''}</span></div>`;
  h+=`<div class="ranksubtabs"><div class="ranksubtab${rankTab==='growth'?' on':''}" data-rt="growth">${t().rankTabGrowth}</div><div class="ranksubtab${rankTab==='words'?' on':''}" data-rt="words">${t().rankTabWords}</div></div>`;
  if(rankTab==='words'){
    const words=hotWords();
    if(!words.length){h+=`<div class="noresult">${t().noResult}</div>`}
    else{
      h+=words.map(([w,d],i)=>{
        const rc=i===0?'w1':i===1?'w2':i===2?'w3':'';
        return `<div class="wordrow"><div class="wordrank ${rc}">${i+1}</div><div class="wordtext">${esc(w)}</div><div class="wordviews">${d.count}${t().wordVideos} · ${fmtNum(d.views)}${t().plays}</div></div>`;
      }).join('');
    }
    el.innerHTML=h;
    el.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{rankTab=b.dataset.rt;renderRank()});
    return;
  }
  const ranked=allVideosWithDelta().slice(0,5);
  if(!hasPrev){h+=`<div class="noresult">${t().noDelta}</div>`}
  else if(!ranked.length){h+=`<div class="noresult">${t().noResult}</div>`}
  else{
    h+=ranked.map((r,i)=>{
      const v=r.v;
      const open=openSet.has('rank_'+v.id);
      const titleHtml = esc(v.title||'');
      let card=`<div class="rankcard${open?' open':''}" style="flex-wrap:wrap;cursor:pointer" data-rankid="${esc(v.id)}">
        <div class="ranknum r${i+1}">${i+1}</div>
        <div class="rankinfo">
          <div class="ranktitle" data-orig-title="${esc(v.title||'')}">${titleHtml}</div>
          <div class="rankchan">${esc(r.chan||'')} · ${t().plays} ${fmtNum(v.views)} · ${t().likes} ${fmtNum(v.likes)}${r.dl>0?` <span class="delta">+${fmtNum(r.dl)}</span>`:''} · ${t().comments} ${fmtNum(v.comments)}${r.dc>0?` <span class="delta">+${fmtNum(r.dc)}</span>`:''} · ${esc(v.published||'—')}</div>
        </div>
        <div class="rankdelta"><div class="d">+${fmtNum(r.d)}</div><div class="l">${t().plays}</div></div>`;
      if(open){
        card+=`<div class="vbody" style="display:block;flex-basis:100%;margin-top:10px">`;
        card+=`<div class="dlabel">${t().desc}</div><div class="dtext" data-translate data-orig="${esc(v.description||'')}">${v.description?esc(v.description):'—'}</div>`;
        if(v.tags&&v.tags.length)card+=`<div class="tags">${v.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div>`;
        const ct=v.comments_text||[];
        const cOpen=commentsOpen.has('rank_'+v.id);
        const showCt=cOpen?ct:ct.slice(0,5);
        card+=`<div class="ctitle">${t().commentsTitle} ${t().captured(ct.length, v.comments==null?'—':fmtNum(v.comments))}</div>`;
        card+=showCt.length?showCt.map(commentHtml).join(''):`<div class="note">—</div>`;
        if(ct.length>5){
          card+=`<div style="text-align:center;margin:10px 0"><button class="sortpill" data-rcexpand="${esc(v.id)}">${cOpen?t().collapseAll:t().expandAll.replace('{n}',ct.length)}</button></div>`;
        }
        card+=`<a class="ytwatch" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">${t().watch}</a>`;
        card+=`</div>`;
      }
      card+=`</div>`;
      return card;
    }).join('');
  }
  el.innerHTML=h;
  el.querySelectorAll('.rankcard').forEach(card=>{
    card.onclick=(e)=>{
      if(e.target.closest('a'))return;
      if(e.target.closest('[data-rcexpand]'))return;
      const id=card.dataset.rankid;
      const key='rank_'+id;
      openSet.has(key)?openSet.delete(key):openSet.add(key);
      renderRank();
      if(openSet.has(key)&&lang==='zh')translateOpen(card);
    };
  });
  el.querySelectorAll('[data-rcexpand]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id='rank_'+b.dataset.rcexpand;
    commentsOpen.has(id)?commentsOpen.delete(id):commentsOpen.add(id);
    renderRank();
  });
  if(lang==='zh')el.querySelectorAll('.rankcard.open').forEach(translateOpen);
  if(titleTransOn)translateTitlesDom(el);
  el.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{rankTab=b.dataset.rt;renderRank()});
}
function filteredVideos(){
  let vs=chanVideos();
  if(query){const q=query.toLowerCase();vs=vs.filter(v=>(v.title||'').toLowerCase().includes(q))}
  if(sortMode==='views')vs.sort((a,b)=>(b.views||0)-(a.views||0));
  else vs.sort((a,b)=>String(b.published||'').localeCompare(String(a.published||'')));
  return vs;
}
/* ---------- 渲染 ---------- */
function renderTabs(){
  const el=document.getElementById('tabs');
  const chans=DATA.channels||[];
  let html=`<div class="tab${curChan===-1?' on':''}" data-i="-1">${lang==='zh'?'全部':'All'}</div>`;
  html+=chans.map((c,i)=>{
    const nm=esc(c.name||'');
    const parts=nm.split(' ');
    const shown=parts.length>1?parts[0]+'<br>'+parts.slice(1).join(' '):nm;
    return `<div class="tab${i===curChan?' on':''}" data-i="${i}">${shown}</div>`;
  }).join('');
  el.innerHTML=html;
  el.querySelectorAll('.tab').forEach(td=>td.onclick=()=>{curChan=+td.dataset.i;openSet.clear();renderAll()});
}
function chanVideos(){
  if(curChan===-1){
    const out=[];
    (DATA.channels||[]).forEach((c,ci)=>{(c.videos||[]).forEach(v=>{const cp=Object.assign({},v);cp._chan=c.name;cp._chanIdx=ci;out.push(cp)})});
    return out;
  }
  return (chan().videos||[]).slice();
}
function renderStats(){
  let subs=null, prevSubs=null, vs, chanUrl='', handle='';
  if(curChan===-1){
    vs=chanVideos();
    subs=(DATA.channels||[]).reduce((a,c)=>a+(c.subs||0),0);
    prevSubs=(DATA.channels||[]).reduce((a,c)=>a+(c.prev_subs||0),0);
    if(!(DATA.channels||[]).some(c=>c.prev_subs!=null))prevSubs=null;
    handle='all';
  }else{
    const c=chan();vs=c.videos||[];
    subs=c.subs;prevSubs=c.prev_subs;chanUrl=c.url||'';
    handle='@'+String(chanUrl).split('/').pop();
  }
  const tot=vs.reduce((a,v)=>a+(v.views||0),0);
  const prevTot=vs.reduce((a,v)=>a+(v.prev_views||0),0);
  const hasPrevTot=vs.some(v=>v.prev_views!=null);
  const avg=vs.length?Math.round(tot/vs.length):0;
  const dSubs=(subs!=null&&prevSubs!=null)?subs-prevSubs:null;
  const dTot=hasPrevTot?tot-prevTot:null;
  const dBadge=d=>(d!=null&&d>0)?`<div><span class="delta">+${fmtNum(d)}</span></div>`:'';
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="num">${fmtNum(subs)}</div>${dBadge(dSubs)}<div class="label">${t().subs}</div></div>
    <div class="stat"><div class="num">${vs.length}</div><div class="label">${t().videos}</div></div>
    <div class="stat"><div class="num">${fmtNum(tot)}</div>${dBadge(dTot)}<div class="label">${t().totalViews}</div></div>
    <div class="stat"><div class="num">${fmtNum(avg)}</div><div class="label">${t().avgViews}</div></div>`;
  document.getElementById('chanlink').innerHTML = curChan===-1 ? '' : `${esc(handle)} · <a href="${esc(chanUrl||'#')}" target="_blank" rel="noopener">${t().openChan}</a>`;
}
function renderSort(){
  document.getElementById('sortrow').innerHTML=`<span class="cap">${t().sort}</span>
    <button class="sortpill${sortMode==='latest'?' on':''}" data-s="latest">${t().latest}</button>
    <button class="sortpill${sortMode==='views'?' on':''}" data-s="views">${t().byViews}</button>
    <button class="sortpill${titleTransOn?' on':''}" id="btn-trans-title">${titleTransOn?t().transTitleOn:t().transTitle}</button>`;
  document.querySelectorAll('.sortpill[data-s]').forEach(b=>b.onclick=()=>{sortMode=b.dataset.s;renderSort();renderList()});
  document.getElementById('btn-trans-title').onclick=toggleTitleTrans;
}
async function translateTitlesDom(scope){
  const els=(scope||document).querySelectorAll('.vtitle[data-orig-title]:not([data-translated="1"]),.ranktitle[data-orig-title]:not([data-translated="1"])');
  for(const el of els){
    const orig=el.getAttribute('data-orig-title');
    if(!orig)continue;
    const tr=await translateText(orig);
    if(tr){
      // 保留所有徽章（爆款、新发布）
      const badges=[...el.querySelectorAll('.badge-hot,.badge-new')].map(b=>b.outerHTML).join('');
      el.innerHTML=badges+esc(tr);
      el.setAttribute('data-translated','1');
    }
  }
}
async function toggleTitleTrans(){
  titleTransOn=!titleTransOn;
  renderSort();renderList();
  if(curView==='rank')renderRank();
  if(titleTransOn){
    await translateTitlesDom(document);
    if(curView==='rank')await translateTitlesDom(document.getElementById('rankview'));
  }
}
function commentHtml(c){
  const likeTxt=c.likes==null?'':` <span class="clike">${t().likeWord} ${c.likes}</span>`;
  let h=`<div class="comment"><div class="chead"><span class="author">${esc(c.author||'?')}</span>${likeTxt}</div><div class="ctext" data-translate data-orig="${esc(c.text||'')}">${esc(c.text||'')}</div>`;
  (c.replies||[]).forEach(r=>{
    const rl=r.likes==null?'':` <span class="clike">${t().likeWord} ${r.likes}</span>`;
    h+=`<div class="reply"><div class="chead"><span class="author">${esc(r.author||'?')}</span>${rl}</div><div class="ctext" data-translate data-orig="${esc(r.text||'')}">${esc(r.text||'')}</div></div>`;
  });
  return h+'</div>';
}
function videoHtml(v){
  const open=openSet.has(v.id);
  const hot=v.hot?`<span class="badge-hot">${t().hot}</span>`:'';
  // 新发布标签：当天发布的视频（数据只有日期精度）
  let isNew='';
  try{
    const today=new Date().toISOString().slice(0,10);
    if(v.published===today)isNew=`<span class="badge-new c-purple">${t().isNew}</span>`;
  }catch(e){}
  const chanTag=(curChan===-1&&v._chan)?`<div class="chan-tag c${(v._chanIdx||0)%4}">${esc(v._chan)}</div>`:'';
  const titleShow=esc(v.title||'');
  const meta=`${t().plays} <b>${fmtNum(v.views)}</b>${deltaHtml(v,'views')} · ${t().likes} ${fmtNum(v.likes)}${deltaHtml(v,'likes')} · ${t().comments} ${fmtNum(v.comments)}${deltaHtml(v,'comments')} · ${t().duration} ${esc(v.duration||'—')} <span class="toggle" data-id="${esc(v.id)}">${open?t().collapse+' ▲':t().detail+' ▼'}</span>`;
  const timeHtml=`<div class="vtime">${esc(v.published||'—')}</div>`;
  let body=`<div class="vbody">`;
  body+=`<div class="dlabel">${t().desc}</div><div class="dtext" data-translate data-orig="${esc(v.description||'')}">${v.description?esc(v.description):'—'}</div>`;
  if(v.tags&&v.tags.length)body+=`<div class="tags">${v.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div>`;
  if(v.note)body+=`<div class="note">${t().note}：${esc(v.note)}</div>`;
  const ct=v.comments_text||[];
  const cOpen=commentsOpen.has(v.id);
  const showCt=cOpen?ct:ct.slice(0,5);
  body+=`<div class="ctitle">${t().commentsTitle} ${t().captured(ct.length, v.comments==null?'—':fmtNum(v.comments))}</div>`;
  body+=showCt.length?showCt.map(commentHtml).join(''):`<div class="note">—</div>`;
  if(ct.length>5){
    body+=`<div style="text-align:center;margin:10px 0"><button class="sortpill" data-cexpand="${esc(v.id)}">${cOpen?t().collapseAll:t().expandAll.replace('{n}',ct.length)}</button></div>`;
  }
  body+=`<a class="ytwatch" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">${t().watch}</a>`;
  body+='</div>';
  return `<div class="video${open?' open':''}" data-vid="${esc(v.id)}"><div class="vhead">${chanTag}<div class="vtitle" data-orig-title="${esc(v.title||'')}">${hot}${isNew}${titleShow}</div><div class="vmeta">${meta}</div></div>${body}${timeHtml}</div>`;
}
function renderList(){
  const vs=filteredVideos();
  const el=document.getElementById('list');
  if(!vs.length){el.innerHTML=`<div class="noresult">${t().noResult}</div>`;return}
  el.innerHTML=vs.map(videoHtml).join('');
  el.querySelectorAll('.vhead').forEach(h=>h.onclick=(e)=>{
    if(e.target.closest('a'))return;
    const id=h.parentElement.dataset.vid;
    openSet.has(id)?openSet.delete(id):openSet.add(id);
    renderList();
    if(openSet.has(id)&&lang==='zh')translateOpen(h.parentElement);
  });
  el.querySelectorAll('.toggle').forEach(tg=>tg.onclick=(e)=>{
    e.stopPropagation();
    const id=tg.dataset.id;
    openSet.has(id)?openSet.delete(id):openSet.add(id);
    renderList();
    if(openSet.has(id)&&lang==='zh'){const card=el.querySelector(`[data-vid="${CSS.escape(id)}"]`);if(card)translateOpen(card)}
  });
  el.querySelectorAll('[data-cexpand]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=b.dataset.cexpand;
    commentsOpen.has(id)?commentsOpen.delete(id):commentsOpen.add(id);
    renderList();
  });
  if(lang==='zh')translateVisible();
  if(titleTransOn)translateTitlesDom(el);
}
async function translateOpen(card){
  const els=card.querySelectorAll('[data-translate]');
  for(const el of els){
    const orig=el.getAttribute('data-orig')||'';
    if(!orig||el.dataset.done)continue;
    el.dataset.done='1';
    el.innerHTML=esc(orig)+` <span class="translating">${t().translating}</span>`;
    const tr=await translateText(orig);
    if(tr){el.innerHTML=esc(tr)+` <span class="translated-tag">${t().translated}</span>`}
    else{el.innerHTML=esc(orig)+(t().transFail?` <span class="translating">${esc(t().transFail)}</span>`:'')}
  }
}
async function translateVisible(){
  document.querySelectorAll('.video.open').forEach(translateOpen);
}
function applyLang(){
  document.getElementById('langicon').textContent = lang==='zh' ? '中 / EN' : 'EN / 中';
  document.getElementById('page-title').textContent=t().pageTitle;
  document.title=t().pageTitle;
  document.getElementById('updated-line').textContent=`${t().updated} ${fmtUpdated('__UPDATED_AT__')}`;
  document.getElementById('search').placeholder=t().search;
  document.getElementById('g-list').textContent=t().listView;
  document.getElementById('g-rank').textContent=t().rankBtn;
  const btt=document.getElementById('btn-trans-title');
  if(btt)btt.textContent=titleTransOn?t().transTitleOn:t().transTitle;
  document.getElementById('footer').textContent=t().footer;
  try{localStorage.setItem('dash-lang',lang)}catch(e){}
  renderAll();
}
function renderAll(){renderTabs();renderStats();renderSort();renderList()}
document.getElementById('langicon').onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang()};
function moveThumb(){
  const seg=document.getElementById('g-seg');
  const thumb=document.getElementById('g-thumb');
  const btn=curView==='rank'?document.getElementById('g-rank'):document.getElementById('g-list');
  if(!seg||!thumb||!btn)return;
  thumb.style.left=btn.offsetLeft+'px';
  thumb.style.width=btn.offsetWidth+'px';
}
function showRank(){
  if(curView==='rank')return;
  curView='rank';
  document.getElementById('g-rank').classList.add('on');
  document.getElementById('g-list').classList.remove('on');
  moveThumb();
  const main=document.getElementById('mainview'), rank=document.getElementById('rankview');
  main.classList.add('flip-out');
  setTimeout(()=>{
    main.classList.add('hidden');main.classList.remove('flip-out');
    rank.classList.remove('hidden');rank.classList.add('flip-in');
    renderRank();
    requestAnimationFrame(()=>requestAnimationFrame(()=>rank.classList.remove('flip-in')));
    window.scrollTo(0,0);
  },320);
}
function showMain(){
  if(curView==='list')return;
  curView='list';
  document.getElementById('g-list').classList.add('on');
  document.getElementById('g-rank').classList.remove('on');
  moveThumb();
  const main=document.getElementById('mainview'), rank=document.getElementById('rankview');
  rank.classList.add('flip-out');
  setTimeout(()=>{
    rank.classList.add('hidden');rank.classList.remove('flip-out');
    main.classList.remove('hidden');main.classList.add('flip-in');
    renderList();
    requestAnimationFrame(()=>requestAnimationFrame(()=>main.classList.remove('flip-in')));
    window.scrollTo(0,0);
  },320);
}
document.getElementById('g-list').onclick=showMain;
document.getElementById('g-rank').onclick=showRank;
// 分段器：滑动 thumb 切换
(function(){
  const seg=document.getElementById('g-seg');
  let startX=0, dragging=false;
  // 初始化 thumb 位置
  function init(){ moveThumb(); }
  if(document.readyState==='complete')init();
  else window.addEventListener('load',init);
  setTimeout(init,100);
  seg.addEventListener('touchstart',e=>{
    dragging=true; startX=e.touches[0].clientX;
  },{passive:true});
  seg.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dx=e.touches[0].clientX-startX;
    // 滑动超过 30px 就切换
    if(dx<-30 && curView==='list'){dragging=false;showRank()}
    else if(dx>30 && curView==='rank'){dragging=false;showMain()}
  },{passive:true});
  seg.addEventListener('touchend',()=>{dragging=false},{passive:true});
})();
// 液态玻璃条：上下滑收起/出现（Apple Music 逻辑）
(function(){
  const bar=document.getElementById('glassbar');
  let lastY=window.scrollY, barHidden=false, ticking=false;
  function onScroll(){
    const y=window.scrollY;
    if(y>lastY+4 && y>120 && !barHidden){
      barHidden=true;
      bar.style.transition='transform .3s ease, opacity .3s ease';
      bar.style.transform='translateX(-50%) translateY(90px)';
      bar.style.opacity='0';
      bar.style.pointerEvents='none';
    }else if(y<lastY-4 && barHidden){
      barHidden=false;
      bar.style.transition='transform .3s ease, opacity .3s ease';
      bar.style.transform='translateX(-50%)';
      bar.style.opacity='1';
      bar.style.pointerEvents='auto';
    }
    lastY=y; ticking=false;
  }
  window.addEventListener('scroll',()=>{
    if(!ticking){ticking=true;requestAnimationFrame(onScroll)}
  },{passive:true});
})();
document.getElementById('search').oninput=(e)=>{query=e.target.value.trim();renderList()};
applyLang();
</script>
