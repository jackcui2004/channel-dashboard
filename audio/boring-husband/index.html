<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonveil 配音 · BoringHusband 全片</title>
<style>
  body { margin: 0; background: #14101c; color: #f2ecff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 20px; line-height: 1.5; margin: 0 0 4px; }
  .sub { color: #b9aed6; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  .now { background: #241b33; border: 1px solid #4b3670; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .now .t { font-size: 16px; margin-bottom: 10px; }
  audio { width: 100%; }
  h2 { font-size: 15px; color: #b9aed6; margin: 24px 0 10px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: center; gap: 12px; background: #1d1626; border: 1px solid #352a4a; border-radius: 10px; padding: 13px 14px; color: #f2ecff; font-size: 15px; text-align: left; width: 100%; cursor: pointer; }
  .item.active { border-color: #9b7ff0; background: #2c2140; }
  .item .num { width: 26px; height: 26px; border-radius: 50%; background: #4b3670; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .item.active .num { background: #9b7ff0; }
  .item .meta { flex: 1; }
  .item .meta small { display: block; color: #b9aed6; font-size: 12px; margin-top: 2px; }
  .item .dl { color: #9b7ff0; font-size: 13px; text-decoration: none; flex-shrink: 0; }
  .tip { color: #8d81a8; font-size: 13px; line-height: 1.7; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>My Mafia Husband Told Me To Find A Lover — Then The Don Took His Wife</h1>
  <p class="sub">Moonveil 配音全片 · Aria 主讲 + Helio 男声 · 共 83 分 33 秒，整片不用拆，点开直接听。</p>
  <div class="now">
    <div class="t">全片 · 83:33</div>
    <audio controls preload="metadata" playsinline src="full.mp3"></audio>
  </div>
  <h2>按章节听（每章完整一段）</h2>
  <div class="list" id="chapters"></div>
  <p class="tip">点一章就播整章，播完自动接下一章。想离线听，点每段右边的“下载”。完整文件也在 Drive「BoringHusband_v2_分镜包」里。</p>
</div>
<script>
function sectionPlayer(listId, files, boxId, titleId, playerId) {
  var list = document.getElementById(listId);
  var current = -1;
  function play(i) {
    current = i;
    var p = document.getElementById(playerId);
    if (!p) {
      var box = document.createElement("div");
      box.className = "now";
      box.innerHTML = '<div class="t" id="' + titleId + '"></div><audio id="' + playerId + '" controls preload="metadata" playsinline></audio>';
      list.parentNode.insertBefore(box, list);
      p = document.getElementById(playerId);
      p.addEventListener("ended", function() {
        if (current + 1 < files.length) play(current + 1);
      });
    }
    p.src = files[i][0];
    document.getElementById(titleId).textContent = files[i][1] + " · " + files[i][2];
    p.play();
    p.scrollIntoView({ behavior: "smooth", block: "center" });
    var items = list.children;
    for (var k = 0; k < items.length; k++) {
      items[k].classList.toggle("active", k === i);
    }
  }
  files.forEach(function(f, i) {
    var b = document.createElement("button");
    b.className = "item";
    b.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="meta">' + f[1] + '<small>' + f[2] + '</small></span>';
    var a = document.createElement("a");
    a.className = "dl";
    a.href = f[0];
    a.download = f[0];
    a.textContent = "下载";
    a.onclick = function(e) { e.stopPropagation(); };
    b.appendChild(a);
    b.onclick = function() { play(i); };
    list.appendChild(b);
  });
}
sectionPlayer("chapters", [
  ["chapters/ch01.mp3", "第 1 章", "6:04"],
  ["chapters/ch02.mp3", "第 2 章", "5:56"],
  ["chapters/ch03.mp3", "第 3 章", "5:20"],
  ["chapters/ch04.mp3", "第 4 章", "4:49"],
  ["chapters/ch05.mp3", "第 5 章", "7:05"],
  ["chapters/ch06.mp3", "第 6 章", "6:57"],
  ["chapters/ch07.mp3", "第 7 章", "6:05"],
  ["chapters/ch08.mp3", "第 8 章", "5:28"],
  ["chapters/ch09.mp3", "第 9 章", "4:21"],
  ["chapters/ch10.mp3", "第 10 章", "9:34"],
  ["chapters/ch11.mp3", "第 11 章", "5:37"],
  ["chapters/ch12.mp3", "第 12 章", "6:26"],
  ["chapters/ch13.mp3", "第 13 章", "3:28"],
  ["chapters/ch14.mp3", "第 14 章", "6:17"]
], "chBox", "chTitle", "chPlayer");
</script>
</body>
</html>
