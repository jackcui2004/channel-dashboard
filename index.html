<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title>YouTube 数据看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f4; --card:#ffffff; --border:#e8e6e3;
  --text:#1a1a1a; --muted:#8a8a8a; --faint:#b5b5b5;
  --red:#d43d2a; --red-dark:#b83224;
  --tag-bg:#f0efed; --tag:#6b6b6b;
  --pill:#f0efed;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:16px 14px 110px;max-width:680px;margin:0 auto;-webkit-font-smoothing:antialiased}
.langicon{display:inline-block;min-width:44px;height:38px;border-radius:19px;padding:0 14px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.06);
  align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;user-select:none;color:var(--text)}
.langicon:active{transform:scale(.95)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.topbar h1{margin:0}
.glassbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:4px;padding:8px;
  background:rgba(255,255,255,.65);backdrop-filter:blur(24px) saturate(200%);-webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);border-radius:28px;
  box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.8);
  user-select:none;-webkit-user-select:none}
.glassbar .seg{position:relative;display:flex;background:rgba(0,0,0,.06);border-radius:20px;padding:3px;border:0}
.glassbar .seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:17px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:left .25s ease,width .25s ease;pointer-events:none}
.glassbar .seg button{position:relative;z-index:1;border:0;background:transparent;padding:9px 18px;border-radius:17px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.glassbar .seg button.on{color:var(--text);box-shadow:none;background:transparent}
.glassbar .refresh{border:0;background:transparent;padding:9px 16px;border-radius:17px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap}
.glassbar .refresh:active{background:rgba(0,0,0,.06)}
h1{font-size:24px;font-weight:800;text-align:center;letter-spacing:1px;margin:6px 0 10px}
.updated{color:var(--muted);font-size:13px;margin-bottom:12px}
.langrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:9px 22px;font-size:15px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:#1a1a1a;color:#fff}
.refresh-btn{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:9px 22px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text)}
.refresh-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.search{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--card);color:var(--text);margin-bottom:6px}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:#cfcfcf}
.tabs{display:flex;border-bottom:1px solid var(--border);margin:14px 0 4px}
.tab{flex:1;text-align:center;padding:12px 4px 10px;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;line-height:1.4}
.tab .n{font-size:15px}
.tab.on{color:var(--text);font-weight:800;border-bottom-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 6px;text-align:center}
.stat .num{font-size:24px;font-weight:800;letter-spacing:.3px}
.stat .label{font-size:12px;color:var(--muted);margin-top:4px}
.chanlink{color:var(--muted);font-size:13px;margin:2px 0 14px}
.chanlink a{color:var(--muted);text-decoration:underline}
.sortrow{display:flex;align-items:center;gap:10px;margin:6px 0 18px;flex-wrap:wrap}
.sortrow .cap{color:var(--muted);font-size:15px}
.sortpill{border:0;border-radius:20px;padding:8px 20px;font-size:15px;font-weight:600;cursor:pointer;background:var(--pill);color:var(--text)}
.sortpill.on{background:#1a1a1a;color:#fff}
.video{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 16px;margin-bottom:14px;position:relative}
.vtime{position:absolute;bottom:4px;right:14px;font-size:12px;color:var(--muted)}
/* 涨幅榜子标签 */
.ranksubtabs{display:flex;gap:8px;margin-bottom:14px}
.ranksubtab{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:6px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.ranksubtab.on{background:var(--text);color:var(--card);border-color:var(--text)}
.wordrow{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.wordrank{font-size:16px;font-weight:800;width:28px;color:var(--red)}
.wordrank.w1{color:#d4a017}.wordrank.w2{color:#888}.wordrank.w3{color:#b87333}
.wordtext{font-size:16px;font-weight:700;flex:1}
.wordviews{font-size:13px;color:var(--muted)}
.posfilters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.posfilter{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.posfilter.on{background:var(--text);color:var(--card);border-color:var(--text)}
.posbadge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px;background:#ececec;color:#555}
.wordpower{color:var(--red);font-weight:800}
.wordhead{font-size:12px;color:var(--muted);margin-bottom:8px}
.expandbtn{text-align:center;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-top:4px}
.vhead{cursor:pointer}
.vtitle{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:21px;font-weight:800;line-height:1.5;margin-bottom:8px}
.badge-hot{display:inline-block;font-size:13px;background:var(--red);color:#fff;border-radius:8px;padding:3px 10px;margin-right:8px;font-weight:700;vertical-align:2px;font-family:-apple-system,"PingFang SC",sans-serif}
.badge-new{display:inline-block;font-size:13px;border-radius:8px;padding:3px 10px;margin-right:8px;font-weight:700;vertical-align:2px;font-family:-apple-system,"PingFang SC",sans-serif}
.badge-new.c-purple{background:#C724FF;color:#fff;box-shadow:0 0 4px rgba(199,36,255,.6)}
.badge-new.c-green{background:#39FF14;color:#000;box-shadow:0 0 4px rgba(57,255,20,.6)}
.badge-new.c-gray{background:#E8E8E8;color:#333;box-shadow:0 0 4px rgba(0,0,0,.15);border:1px solid #ccc}
.badge-new.c-red{background:#FF3131;color:#fff;box-shadow:0 0 4px rgba(255,49,49,.6)}
/* 频道 ID 底色（调灰版，低调区分） */
.chan-tag{display:inline-block;font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:12.5px;border-radius:6px;padding:2px 10px;margin-bottom:6px;font-weight:600}
.video .chan-tag{font-size:16px}
.chan-tag.c0{background:#E6D9F0;color:#5A3D7A}
.chan-tag.c1{background:#D9E8D9;color:#3D6B3D}
.chan-tag.c2{background:#E2E2E2;color:#555}
.chan-tag.c3{background:#F0D9D9;color:#7A3D3D}
.vmeta{font-size:14px;color:var(--muted);line-height:1.8}
.vmeta b{color:var(--text);font-weight:700}
/* 视频卡片：数字平摊一行 + 底行左中右固定位 */
.vstats{display:flex;margin:12px 0 2px}
.vstat{flex:1;text-align:center;font-size:16px;white-space:nowrap}
.vstat:first-child{text-align:left}
.vstat:last-child{text-align:right}
.vstat b{font-weight:700}
.vlab{color:var(--muted);font-size:14px;font-weight:400}
.vfoot{display:flex;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.vfoot-l{flex:1;text-align:left;white-space:nowrap}
.vfoot-c{flex:1;text-align:center;white-space:nowrap}
.vfoot-r{flex:1;text-align:right}
.rankchan-top{font-size:13px;font-weight:700;margin-bottom:4px}
.ranktime{text-align:left;font-size:12.5px;color:var(--muted);margin-top:6px;white-space:nowrap}
.toggle{color:var(--red);font-weight:700;cursor:pointer;white-space:nowrap}
.vbody{display:none;margin-top:6px}
.video.open .vbody{display:block}
.dlabel{color:var(--muted);font-size:14px;margin:14px 0 6px}
.dtext{font-size:15.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.dtext .translating{color:var(--faint);font-size:13px}
.translated-tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:var(--tag-bg);color:var(--tag);border-radius:14px;padding:4px 14px;font-size:13.5px}
.note{color:var(--muted);font-size:13.5px;margin-top:12px;line-height:1.8}
.ctitle{color:var(--muted);font-size:14.5px;margin:16px 0 10px;font-weight:600}
.comment{margin:0 0 16px;font-size:15px}
.comment .chead{margin-bottom:4px}
.comment .author{font-weight:800}
.comment .clike{color:var(--muted);font-size:13.5px;margin-left:10px;font-weight:400}
.comment .ctext{line-height:1.8;word-break:break-word}
.comment .reply{margin:10px 0 0 6px;padding-left:14px;border-left:3px solid #e0dedb}
.comment .reply .ctext{line-height:1.8}
.ytwatch{display:inline-block;margin-top:14px;color:var(--red);font-size:16px;font-weight:600;text-decoration:underline}
.footer{margin-top:26px;color:var(--faint);font-size:12px;text-align:center;line-height:1.8}
.noresult{text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
.pageview{transition:transform .35s ease,opacity .35s ease;transform-origin:top center}
.pageview.hidden{display:none}
.pageview.flip-out{transform:perspective(1200px) rotateY(-18deg);opacity:0}
.pageview.flip-in{transform:perspective(1200px) rotateY(18deg);opacity:0}
/* ---------- 数据洞察 ---------- */
.icard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.icard h2{font-size:17px;margin:0 0 4px}
.icard .inote{font-size:12px;color:var(--muted);margin-bottom:8px}
.irow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
.irow:first-of-type{border-top:0}
.irow .grow{flex:1;min-width:0}
.irow .num{font-weight:700;white-space:nowrap}
.irow .sub{font-size:12px;color:var(--muted)}
.ibadge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.ibadge.green{background:#e7f6ec;color:#1e7a34}
.ibadge.amber{background:#fdf3e3;color:#9a6a12}
.ibadge.red{background:#fdecea;color:#b83224}
.ibadge.purple{background:#f1eafe;color:#6d28d9}
.ibadge.gray{background:var(--pill);color:var(--muted)}
.ititle{font-weight:700}
.isample{font-size:13px;color:var(--muted);background:var(--tag-bg);border-radius:8px;padding:6px 8px;margin-top:6px}
.iblock{padding:10px 0;border-top:1px solid var(--border)}
.iblock:first-of-type{border-top:0}
.iblock .ititle{font-weight:700}
.iblock .istat{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
.iblock .istat .sp{flex:1;min-width:0}
.ypp-days{font-size:26px;font-weight:800;line-height:1.1;white-space:nowrap}
.ypp-days small{font-size:13px;font-weight:700}
/* 里程碑行：左右两栏，固定格式 */
.ypp-row{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--border)}
.ypp-row:first-of-type{border-top:0}
.ypp-left{flex:1;min-width:0}
.ypp-name{margin-bottom:8px}
.ypp-metric{font-size:13px;color:var(--muted);line-height:1.8;white-space:nowrap}
.ypp-metric b{color:var(--text);font-weight:700}
.ypp-right{flex-shrink:0;text-align:right;margin-top:10px;display:flex;flex-direction:column;align-items:flex-end}
.ypp-target{margin-bottom:10px}
.target-badge{display:inline-block;font-size:13px;font-weight:700;border:1.5px solid;border-radius:999px;padding:2px 10px;line-height:1.5;white-space:nowrap}
.ypp-need{font-size:13px;color:var(--muted);line-height:1.7;white-space:nowrap;margin-top:4px}
.ypp-eta{font-size:13px;color:var(--muted);line-height:1.7;white-space:nowrap}
/* 视频条目：标题完整 + 信息竖排固定格式 */
.vlist{display:flex;flex-direction:column;gap:0}
.vlist .vrow{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-size:13px;line-height:1.8;white-space:nowrap}
.vlist .vrow .k{color:var(--muted);flex-shrink:0}
.vlist .vrow .v{color:var(--text);font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.delta{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:#fdeceb;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.stat .delta{margin-left:0;margin-top:4px}
.viewseg{margin:6px 0 4px}
.rankcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.ranknum{font-size:22px;font-weight:800;color:var(--red);min-width:28px;text-align:center}
.ranknum.r1{color:#d43d2a}.ranknum.r2{color:#e0705a}.ranknum.r3{color:#e8a07a}
.rankinfo{flex:1;min-width:0}
.ranktitle{font-size:15px;font-weight:700;line-height:1.5}
.rankchan{font-size:12.5px;color:var(--muted);margin-top:2px}
.rankdelta{text-align:right;white-space:nowrap}
.rankdelta .d{font-size:18px;font-weight:800;color:var(--red)}
.rankdelta .l{font-size:11.5px;color:var(--muted)}
.rankhead{font-size:15px;font-weight:800;margin:14px 0 10px}
.rankhead .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
/* 昨日数据排行卡片（邮件样式：图在上、标题在下） */
.dcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px}
.dthumb{width:100%;border-radius:8px;display:block;border:0}
.dline1{font-size:15px;font-weight:bold;margin:12px 0 4px 0}
.dline2{font-size:14px;margin:0 0 8px 0}
.dline2 b{color:var(--red)}
.dpred{font-size:14px;margin:0 0 8px 0;color:var(--muted)}
.dpred b{color:var(--red)}
.dpred .parrow{color:var(--muted);margin:0 4px}
.trend{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.trend.rising{background:#fde8e8;color:#c81e1e}
.trend.breakout{background:#e6f4ea;color:#137333}
.trend.peaked{background:#f1f3f4;color:#5f6368}
.trend.flat{background:#f1f3f4;color:#80868b}
.trendlegend{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 0 12px 0;font-size:13px;line-height:1.9;color:var(--text)}
.trendlegend .tl{font-weight:800;margin-bottom:2px}
.dtitle{font-size:15px;font-weight:bold;line-height:1.5;margin:0 0 4px 0}
.dtitle a{color:var(--text);text-decoration:none}
.dzh{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 8px 0}
.dmeta{font-size:13px;color:var(--muted);margin:0}
.dline1 b{color:var(--red)}
/* 前三名特效：金 / 银 / 铜 */
.dcard.top1{border-color:#d4a017;box-shadow:0 0 0 1px #d4a017,0 4px 18px rgba(212,160,23,.28)}
.dcard.top2{border-color:#9ca3af;box-shadow:0 0 0 1px #9ca3af,0 4px 18px rgba(156,163,175,.28)}
.dcard.top3{border-color:#b87333;box-shadow:0 0 0 1px #b87333,0 4px 18px rgba(184,115,51,.28)}
.rankcard.top1{border-color:#d4a017;box-shadow:0 0 0 1px #d4a017,0 4px 18px rgba(212,160,23,.28)}
.rankcard.top2{border-color:#9ca3af;box-shadow:0 0 0 1px #9ca3af,0 4px 18px rgba(156,163,175,.28)}
.rankcard.top3{border-color:#b87333;box-shadow:0 0 0 1px #b87333,0 4px 18px rgba(184,115,51,.28)}
.wordrow.top1{border-color:#d4a017;box-shadow:0 0 0 1px #d4a017,0 4px 18px rgba(212,160,23,.28)}
.wordrow.top2{border-color:#9ca3af;box-shadow:0 0 0 1px #9ca3af,0 4px 18px rgba(156,163,175,.28)}
.wordrow.top3{border-color:#b87333;box-shadow:0 0 0 1px #b87333,0 4px 18px rgba(184,115,51,.28)}
.dline1.top1{color:#b8860b}
.dline1.top2{color:#6b7280}
.dline1.top3{color:#92400e}
@media(max-width:480px){
  .vtitle{font-size:19px}
  .stat .num{font-size:20px}
  .stats{gap:8px}
  .stat{padding:12px 4px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
<h1 id="page-title">YouTube 数据看板</h1>
<div class="langicon" id="langicon" title="切换语言">中 / EN</div>
</div>
<div class="updated" id="updated-line">数据更新于 2026-11-14T17:55:17+08:00</div>
<input class="search" id="search" placeholder="🔍 搜索标题关键词...">
<div id="mainview" class="pageview">
<div class="tabs" id="tabs"></div>
<div id="list-controls">
<div class="stats" id="stats"></div>
<div class="chanlink" id="chanlink"></div>
<div class="sortrow" id="sortrow"></div>
</div>
<div id="list"></div>
</div>
<div id="rankview" class="pageview hidden">
  <div id="ranklist"></div>
</div>
<div id="insightview" class="pageview hidden">
  <div id="insightlist"></div>
</div>
<div class="footer" id="footer"></div>
<div class="glassbar" id="glassbar">
  <div class="seg" id="g-seg">
    <div class="thumb" id="g-thumb"></div>
    <button id="g-list" class="on">列表</button>
    <button id="g-rank">📈 涨幅榜</button>
    <button id="g-insight">💡 数据洞察</button>
  </div>

<script>
const DATA = {"updated_at": "2026-11-14T17:55:17+08:00", "channels": [{"id": "moonveilstories", "name": "Moonveil Stories", "url": "https://www.youtube.com/@moonveilstories-h1/videos", "subs": 1150, "videos": [{"id": "avUpbmECY70", "title": "For 40 Years I Told My Mafia Husband \"You're Not Him\" In Portuguese. He Thought It Meant I Love You", "views": 227, "likes": 5, "comments": 5, "duration": "1:18:50", "published": "2026-11-13", "published_at": "2026-11-13 22:00", "description": "He Won Me On A $500 Bet. Forty Years Later, He Knelt On The Pier And Begged To Be The Man I Loved\nI Was The Don's Perfect Wife For 40 Years. Every Anniversary Lunch Was For A Fisherman Who Drowned\n\nDESCRIPTION\nAt our ruby anniversary party, my husband stood up in front of two hundred guests and told the story he loves best. How his brothers bet him five hundred dollars he could never marry the quiet girl who mended nets on the fish pier. How his wooden wife never cries and never laughs. And how, every night for forty years, she has whispered I love you to him in Portuguese. Tu não és ele.\n\nThat is not what it means. It never was. And three weeks after the party, Frank Rinaldi, the old Don of Cutter Hill, is about to learn what his wife has been saying in the dark, who she has been looking at across the water, and what she really agreed to on the night she said yes.\n\nAn original story written and produced by Moonveil Stories. Part of the Port Marlowe series.\n\nIf someone told you the truth every night for forty years in a language you never learned, whose fault would that be?", "tags": ["mafia romance", "mafia husband", "mafia wife revenge", "quiet revenge story", "revenge audiobook", "married for a bet", "first love drowned", "Portuguese fishermen", "old Don", "forty year marriage", "late life divorce", "she left him", "emotional audiobook", "Port Marlowe", "Moonveil Stories"], "comments_text": [{"author": "@elkezander6485", "text": "Such a sad story 😢", "likes": 1, "time": "20 fia story", "piano tuner", "revenge story", "found family", "slow burn romance", "protective hero", "hidden ledger", "kidnapped sister", "first person audiobook", "romantic suspense", "crime family drama", "enemies to allies", "original audiobook"], "comments_text": [{"author": "@MoonveilStories-h1", "text": "Nora found her answer by doing what her father taught her: look inside first. What would you have done with that ledger at twelve twenty-nine?", "likes": 0, "time": "2026-11-12 23:11", "replies": []}], "hot": false, "prev_views": 365, "prev_likes": 7, "prev_comments": 1, "tpower": 2786, "fresh": 0.797, "quote": 0, "pred": 33076, "pred_daily": 10, "pred_daily_tm": 9, "pred_tomorrow_total": 376}, {"id": "E4w5p5Xej8Q", "title": "\"Girlfriend... or Maid?\" She Laughed—Then This Time He Took Her Hand", "views": 616, "likes": 24, "comments": 4, "duration": "1:20:32", "published": "2026-11-08", "published_at": "2026-11-08 20:00", "description": "\"Girlfriend... or maid?\" When the wealthy new transfer student cornered the housekeeper's daughter at her desk and exposed her biggest secret to the entire senior class at Fairview Academy, everyone expected her to beg for mercy. For three years, she had sat beside Leo Santoro—the cold, untouchable heir to the Santoro mafia family—sorting the hundreds of love notes other girls stuffed into his drawer. And for three years, she had stepped out of the Santoro family's black sedan a block early every single day so no one would know she lived in the servants' quarters behind his estate.\n\nWhen the class group chat blew up with the truth about her mother scrubbing the Santoros' floors on her knees, she didn't cry or wait for Leo to defend her. She picked up her books in front of thirty gloating classmates, moved six rows back to the corner by the rear window, and prepared to disappear from his world for good. It wasn't until the night before the district-wide finals that seven unsigned notes slipped out from the bindings of her textbooks—revealing a secret Leo Santoro had been hiding right beside her elbow for three whole years.\n\nForced out of the Santoro estate when Leo's mother targeted her mom's livelihood, she transferred to a public school on the south side and told Leo not to come looking for her until the day he had a way of his own. She thought a seventeen-year-old's promise would fade with the winter wind. She never expected him to walk out on the Santoro fortune, build a company from the ground up with his own two hands, and wait outside her university graduation four years later with a corporate registration certificate, a two-bedroom lease bearing a blank second signature line, and a promise that changed everything: \"Today, I came a block early to pick you up.\"\n\nIf this story moved you, please hit the LIKE button, share your thoughts in the COMMENTS, and SUBSCRIBE to the channel for more full-length audiobooks!\nQuestion for you: Would you have given Leo a chance to prove himself after four years of silence, or walked away for good that night outside the convenience store? Let us know in the comments below!\n\nAn original story written and produced by Moonveil Stories.\n\n#MafiaRomance #Audiobook #FullStory #RichBoyPoorGirl #HighSchoolDrama #SecondChanceRomance #SecretCrush #EmotionalStory #SweetRevenge #Storytime", "tags": ["mafia romance", "high school romance", "rich boy poor girl", "secret crush", "second chance romance", "deskmate love story", "campus romance audiobook", "mafia heir", "housekeeper's daughter", "four year wait", "emotional audiobook", "original audiobook", "full audiobook romance", "young love", "coming of age"], "comments_text": [{"author": "@Dean-y1t7f", "text": "Great story.  Loved it.", "likes": 0, "time": "2026-11-14 13:28", "replies": []}, {"author": "@cathymcgowin3940", "text": "Great story pahrump nv", "likes": 2, "time": "2026-11-09 01:04", "replies": []}, {"author": "@MidnightVowsTales", "text": "❤🎉", "likes": 1, "time": "2026-11-10 23:29", " function renderStats(){
  let subs=null, prevSubs=null, vs, chanUrl='', handle='';
  if(curChan===-1){
    vs=chanVideos();
    subs=(DATA.channels||[]).reduce((a,c)=>a+(c.subs||0),0);
    prevSubs=(DATA.channels||[]).reduce((a,c)=>a+(c.prev_subs||0),0);
    if(!(DATA.channels||[]).some(c=>c.prev_subs!=null))prevSubs=null;
    handle='all';
  }else{
    const c=chan();vs=c.videos||[];
    subs=c.subs;prevSubs=c.prev_subs;chanUrl=c.url||'';
    handle='@'+String(chanUrl).split('/').pop();
  }
  const tot=vs.reduce((a,v)=>a+(v.views||0),0);
  const prevTot=vs.reduce((a,v)=>a+(v.prev_views||0),0);
  const hasPrevTot=vs.some(v=>v.prev_views!=null);
  const avg=vs.length?Math.round(tot/vs.length):0;
  const dSubs=(subs!=null&&prevSubs!=null)?subs-prevSubs:null;
  const dTot=hasPrevTot?tot-prevTot:null;
  const dBadge=d=>(d!=null&&d>0)?`<div><span class="delta">+${fmtNum(d)}</span></div>`:'';
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="num">${fmtW(subs)}</div>${dBadge(dSubs)}<div class="label">${t().subs}</div></div>
    <div class="stat"><div class="num">${vs.length}</div><div class="label">${t().videos}</div></div>
    <div class="stat"><div class="num">${fmtW(tot)}</div>${dBadge(dTot)}<div class="label">${t().totalViews}</div></div>
    <div class="stat"><div class="num">${fmtW(avg)}</div><div class="label">${t().avgViews}</div></div>`;
  document.getElementById('chanlink').innerHTML = curChan===-1 ? '' : `${esc(handle)} · <a href="${esc(chanUrl||'#')}" target="_blank" rel="noopener">${t().openChan}</a>`;

async function translateOpen(card){

    el.dataset.done='1';
    el.innerHTML=esc(orig)+` <span class="translating">${t().translating}</span>`;

    if(tr){el.innerHTML=esc(tr)+` <span class="translated-tag">${t().translated}</span>`}
    else{el.innerHTML=esc(orig)+(t().transFail?` <span class="translating">${esc(t().transFail)}</span>`:'')}

  document.getElementById('page-title').textContent=t().pageTitle;
  document.title=t().pageTitle;
  document.getElementById('updated-line').textContent=`${t().updated} ${fmtUpdated('2026-11-14T17:55:17+08:00')}`;
  document.getElementById('search').placeholder=t().search;
  document.getElementById('g-list').textContent=t().listView;
  document.getElementById('g-rank').textContent=t().rankBtn;
  document.getElementById('g-insight').textContent=t().insightView;
  const btt=document.getElementById('btn-trans-title');
  if(btt)btt.textContent=titleTransOn?t().transTitleOn:t().transTitle;
  document.getElementById('footer').textContent=t().footer;
  try{localStorage.setItem('dash-lang',lang)}catch(e){}
  renderAll();
  if(curView==='insight')renderInsights();
}
function renderAll(){renderTabs();renderStats();renderSort();renderList()}
document.getElementById('langicon').onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang()};
function moveThumb(){
  const seg=document.getElementById('g-seg');
  const thumb=document.getElementById('g-thumb');
  const btn=curView==='rank'?document.getElementById('g-rank'):curView==='insight'?document.getElementById('g-insight'):document.getElementById('g-list');
  if(!seg||!thumb||!btn)return;
  thumb.style.left=btn.offsetLeft+'px';
  thumb.style.width=btn.offsetWidth+'px';
}
function showView(name){
  if(curView===name)return;
  savedScroll[curView]=window.scrollY;
  const prev=curView;
  curView=name;
  document.getElementById('g-list').classList.toggle('on',name==='list');
  document.getElementById('g-rank').classList.toggle('on',name==='rank');
  document.getElementById('g-insight').classList.toggle('on',name==='insight');
  moveThumb();
  const views={list:document.getElementById('mainview'),rank:document.getElementById('rankview'),insight:document.getElementById('insightview')};
  const fromEl=views[prev], toEl=views[name];
  fromEl.classList.add('flip-out');
  setTimeout(()=>{
    fromEl.classList.add('hidden');fromEl.classList.remove('flip-out');
    toEl.classList.remove('hidden');toEl.classList.add('flip-in');
    if(name==='rank')renderRank();
    if(name==='list')renderList();
    if(name==='insight')renderInsights();
    requestAnimationFrame(()=>requestAnimationFrame(()=>toEl.classList.remove('flip-in')));
    window.scrollTo(0,savedScroll[name]||0);
  },320);
}
function showRank(){showView('rank')}
function showMain(){showView('list')}
function showInsight(){showView('insight')}
document.getElementById('g-list').onclick=showMain;
document.getElementById('g-rank').onclick=showRank;
document.getElementById('g-insight').onclick=showInsight;
// 分段器：滑动 thumb 切换
(function(){
  const seg=document.getElementById('g-seg');
  let startX=0, dragging=false;
  // 初始化 thumb 位置
  function init(){ moveThumb(); }
  if(document.readyState==='complete')init();
  else window.addEventListener('load',init);
  setTimeout(init,100);
  seg.addEventListener('touchstart',e=>{
    dragging=true; startX=e.touches[0].clientX;
  },{passive:true});
  seg.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dx=e.touches[0].clientX-startX;
    // 滑动超过 30px 就切换
    const order=['list','rank','insight'];
    if(dx<-30){const i=order.indexOf(curView);if(i>=0&&i<order.length-1){dragging=false;showView(order[i+1])}}
    else if(dx>30){const i=order.indexOf(curView);if(i>0){dragging=false;showView(order[i-1])}}
  },{passive:true});
  seg.addEventListener('touchend',()=>{dragging=false},{passive:true});
})();
// 液态玻璃条：上下滑收起/出现（Apple Music 逻辑）
(function(){
  const bar=document.getElementById('glassbar');
  let lastY=window.scrollY, barHidden=false, ticking=false;
  function onScroll(){
    const y=window.scrollY;
    if(y>lastY+4 && y>120 && !barHidden){
      barHidden=true;
      bar.style.transition='transform .3s ease, opacity .3s ease';
      bar.style.transform='translateX(-50%) translateY(90px)';
      bar.style.opacity='0';
      bar.style.pointerEvents='none';
    }else if(y<lastY-4 && barHidden){
      barHidden=false;
      bar.style.transition='transform .3s ease, opacity .3s ease';
      bar.style.transform='translateX(-50%)';
      bar.style.opacity='1';
      bar.style.pointerEvents='auto';
    }
    lastY=y; ticking=false;
  }
  window.addEventListener('scroll',()=>{
    if(!ticking){ticking=true;requestAnimationFrame(onScroll)}
  },{passive:true});
})();
document.getElementById('search').oninput=(e)=>{query=e.target.value.trim();renderList()};
applyLang();
</script>
