<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title>YouTube 数据看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f4; --card:#ffffff; --border:#e8e6e3;
  --text:#1a1a1a; --muted:#8a8a8a; --faint:#b5b5b5;
  --red:#d43d2a; --red-dark:#b83224;
  --tag-bg:#f0efed; --tag:#6b6b6b;
  --pill:#f0efed;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:16px 14px 110px;max-width:680px;margin:0 auto;-webkit-font-smoothing:antialiased}
.langicon{display:inline-block;min-width:44px;height:38px;border-radius:19px;padding:0 14px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.06);
  align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;user-select:none;color:var(--text)}
.langicon:active{transform:scale(.95)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.topbar h1{margin:0}
.glassbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:4px;padding:8px;
  background:rgba(255,255,255,.65);backdrop-filter:blur(24px) saturate(200%);-webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);border-radius:28px;
  box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.8);
  user-select:none;-webkit-user-select:none}
.glassbar .seg{position:relative;display:flex;background:rgba(0,0,0,.06);border-radius:20px;padding:3px;border:0}
.glassbar .seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:17px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:left .25s ease,width .25s ease;pointer-events:none}
.glassbar .seg button{position:relative;z-index:1;border:0;background:transparent;padding:9px 18px;border-radius:17px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.glassbar .seg button.on{color:var(--text);box-shadow:none;background:transparent}
.glassbar .refresh{border:0;background:transparent;padding:9px 16px;border-radius:17px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap}
.glassbar .refresh:active{background:rgba(0,0,0,.06)}
h1{font-size:24px;font-weight:800;text-align:center;letter-spacing:1px;margin:6px 0 10px}
.updated{color:var(--muted);font-size:13px;margin-bottom:12px}
.langrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:9px 22px;font-size:15px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:#1a1a1a;color:#fff}
.refresh-btn{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:9px 22px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text)}
.refresh-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.search{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:12px;font-size:15px;background:var(--card);color:var(--text);margin-bottom:6px}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:#cfcfcf}
.tabs{display:flex;border-bottom:1px solid var(--border);margin:14px 0 4px}
.tab{flex:1;text-align:center;padding:12px 4px 10px;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;line-height:1.4}
.tab .n{font-size:15px}
.tab.on{color:var(--text);font-weight:800;border-bottom-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 6px;text-align:center}
.stat .num{font-size:24px;font-weight:800;letter-spacing:.3px}
.stat .label{font-size:12px;color:var(--muted);margin-top:4px}
.chanlink{color:var(--muted);font-size:13px;margin:2px 0 14px}
.chanlink a{color:var(--muted);text-decoration:underline}
.sortrow{display:flex;align-items:center;gap:10px;margin:6px 0 18px;flex-wrap:wrap}
.sortrow .cap{color:var(--muted);font-size:15px}
.sortpill{border:0;border-radius:20px;padding:8px 20px;font-size:15px;font-weight:600;cursor:pointer;background:var(--pill);color:var(--text)}
.sortpill.on{background:#1a1a1a;color:#fff}
.video{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 16px;margin-bottom:14px;position:relative}
.vtime{position:absolute;bottom:4px;right:14px;font-size:12px;color:var(--muted)}
/* 涨幅榜子标签 */
.ranksubtabs{display:flex;gap:8px;margin-bottom:14px}
.ranksubtab{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:6px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.ranksubtab.on{background:var(--text);color:var(--card);border-color:var(--text)}
.wordrow{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.wordrank{font-size:16px;font-weight:800;width:28px;color:var(--red)}
.wordrank.w1{color:#d4a017}.wordrank.w2{color:#888}.wordrank.w3{color:#b87333}
.wordtext{font-size:16px;font-weight:700;flex:1}
.wordviews{font-size:13px;color:var(--muted)}
.posfilters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.posfilter{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.posfilter.on{background:var(--text);color:var(--card);border-color:var(--text)}
.posbadge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px;background:#ececec;color:#555}
.wordpower{color:var(--red);font-weight:800}
.wordhead{font-size:12px;color:var(--muted);margin-bottom:8px}
.expandbtn{text-align:center;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-top:4px}
.vhead{cursor:pointer}
.vtitle{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:21px;font-weight:800;line-height:1.5;margin-bottom:8px}
.badge-hot{display:inline-block;font-size:13px;background:var(--red);color:#fff;border-radius:8px;padding:3px 10px;margin-right:8px;font-weight:700;vertical-align:2px;font-family:-apple-system,"PingFang SC",sans-serif}
.badge-new{display:inline-block;font-size:13px;border-radius:8px;padding:3px 10px;margin-right:8px;font-weight:700;vertical-align:2px;font-family:-apple-system,"PingFang SC",sans-serif}
.badge-new.c-purple{background:#C724FF;color:#fff;box-shadow:0 0 4px rgba(199,36,255,.6)}
.badge-new.c-green{background:#39FF14;color:#000;box-shadow:0 0 4px rgba(57,255,20,.6)}
.badge-new.c-gray{background:#E8E8E8;color:#333;box-shadow:0 0 4px rgba(0,0,0,.15);border:1px solid #ccc}
.badge-new.c-red{background:#FF3131;color:#fff;box-shadow:0 0 4px rgba(255,49,49,.6)}
/* 频道 ID 底色（调灰版，低调区分） */
.chan-tag{display:inline-block;font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:12.5px;border-radius:6px;padding:2px 10px;margin-bottom:6px;font-weight:600}
.video .chan-tag{font-size:16px}
.chan-tag.c0{background:#E6D9F0;color:#5A3D7A}
.chan-tag.c1{background:#D9E8D9;color:#3D6B3D}
.chan-tag.c2{background:#E2E2E2;color:#555}
.chan-tag.c3{background:#F0D9D9;color:#7A3D3D}
.vmeta{font-size:14px;color:var(--muted);line-height:1.8}
.vmeta b{color:var(--text);font-weight:700}
/* 视频卡片：数字平摊一行 + 底行左中右固定位 */
.vstats{display:flex;margin:12px 0 2px}
.vstat{flex:1;text-align:center;font-size:16px;white-space:nowrap}
.vstat:first-child{text-align:left}
.vstat:last-child{text-align:right}
.vstat b{font-weight:700}
.vlab{color:var(--muted);font-size:14px;font-weight:400}
.vfoot{display:flex;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.vfoot-l{flex:1;text-align:left;white-space:nowrap}
.vfoot-c{flex:1;text-align:center;white-space:nowrap}
.vfoot-r{flex:1;text-align:right}
.rankchan-top{font-size:13px;font-weight:700;margin-bottom:4px}
.ranktime{text-align:left;font-size:12.5px;color:var(--muted);margin-top:6px;white-space:nowrap}
.toggle{color:var(--red);font-weight:700;cursor:pointer;white-space:nowrap}
.vbody{display:none;margin-top:6px}
.video.open .vbody{display:block}
.dlabel{color:var(--muted);font-size:14px;margin:14px 0 6px}
.dtext{font-size:15.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.dtext .translating{color:var(--faint);font-size:13px}
.translated-tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:var(--tag-bg);color:var(--tag);border-radius:14px;padding:4px 14px;font-size:13.5px}
.note{color:var(--muted);font-size:13.5px;margin-top:12px;line-height:1.8}
.ctitle{color:var(--muted);font-size:14.5px;margin:16px 0 10px;font-weight:600}
.comment{margin:0 0 16px;font-size:15px}
.comment .chead{margin-bottom:4px}
.comment .author{font-weight:800}
.comment .clike{color:var(--muted);font-size:13.5px;margin-left:10px;font-weight:400}
.comment .ctext{line-height:1.8;word-break:break-word}
.comment .reply{margin:10px 0 0 6px;padding-left:14px;border-left:3px solid #e0dedb}
.comment .reply .ctext{line-height:1.8}
.ytwatch{display:inline-block;margin-top:14px;color:var(--red);font-size:16px;font-weight:600;text-decoration:underline}
.footer{margin-top:26px;color:var(--faint);font-size:12px;text-align:center;line-height:1.8}
.noresult{text-align:center;color:var(--muted);padding:40px 0;font-size:15px}
.pageview{transition:transform .35s ease,opacity .35s ease;transform-origin:top center}
.pageview.hidden{display:none}
.pageview.flip-out{transform:perspective(1200px) rotateY(-18deg);opacity:0}
.pageview.flip-in{transform:perspective(1200px) rotateY(18deg);opacity:0}
/* ---------- 数据洞察 ---------- */
.icard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.icard h2{font-size:17px;margin:0 0 4px}
.icard .inote{font-size:12px;color:var(--muted);margin-bottom:8px}
.irow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
.irow:first-of-type{border-top:0}
.irow .grow{flex:1;min-width:0}
.irow .num{font-weight:700;white-space:nowrap}
.irow .sub{font-size:12px;color:var(--muted)}
.ibadge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.ibadge.green{background:#e7f6ec;color:#1e7a34}
.ibadge.amber{background:#fdf3e3;color:#9a6a12}
.ibadge.red{background:#fdecea;color:#b83224}
.ibadge.purple{background:#f1eafe;color:#6d28d9}
.ibadge.gray{background:var(--pill);color:var(--muted)}
.ititle{font-weight:700}
.isample{font-size:13px;color:var(--muted);background:var(--tag-bg);border-radius:8px;padding:6px 8px;margin-top:6px}
.iblock{padding:10px 0;border-top:1px solid var(--border)}
.iblock:first-of-type{border-top:0}
.iblock .ititle{font-weight:700}
.iblock .istat{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
.iblock .istat .sp{flex:1;min-width:0}
.ypp-days{font-size:26px;font-weight:800;line-height:1.1;white-space:nowrap}
.ypp-days small{font-size:13px;font-weight:700}
/* 里程碑行：左右两栏，固定格式 */
.ypp-row{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--border)}
.ypp-row:first-of-type{border-top:0}
.ypp-left{flex:1;min-width:0}
.ypp-name{margin-bottom:8px}
.ypp-metric{font-size:13px;color:var(--muted);line-height:1.8;white-space:nowrap}
.ypp-metric b{color:var(--text);font-weight:700}
.ypp-right{flex-shrink:0;text-align:right;margin-top:10px;display:flex;flex-direction:column;align-items:flex-end}
.ypp-target{margin-bottom:10px}
.target-badge{display:inline-block;font-size:13px;font-weight:700;border:1.5px solid;border-radius:999px;padding:2px 10px;line-height:1.5;white-space:nowrap}
.ypp-need{font-size:13px;color:var(--muted);line-height:1.7;white-space:nowrap;margin-top:4px}
.ypp-eta{font-size:13px;color:var(--muted);line-height:1.7;white-space:nowrap}
/* 视频条目：标题完整 + 信息竖排固定格式 */
.vlist{display:flex;flex-direction:column;gap:0}
.vlist .vrow{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-size:13px;line-height:1.8;white-space:nowrap}
.vlist .vrow .k{color:var(--muted);flex-shrink:0}
.vlist .vrow .v{color:var(--text);font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.delta{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:#fdeceb;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.stat .delta{margin-left:0;margin-top:4px}
.viewseg{margin:6px 0 4px}
.rankcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.ranknum{font-size:22px;font-weight:800;color:var(--red);min-width:28px;text-align:center}
.ranknum.r1{color:#d43d2a}.ranknum.r2{color:#e0705a}.ranknum.r3{color:#e8a07a}
.rankinfo{flex:1;min-width:0}
.ranktitle{font-size:15px;font-weight:700;line-height:1.5}
.rankchan{font-size:12.5px;color:var(--muted);margin-top:2px}
.rankdelta{text-align:right;white-space:nowrap}
.rankdelta .d{font-size:18px;font-weight:800;color:var(--red)}
.rankdelta .l{font-size:11.5px;color:var(--muted)}
.rankhead{font-size:15px;font-weight:800;margin:14px 0 10px}
.rankhead .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
/* 昨日数据排行卡片（邮件样式：图在上、标题在下） */
.dcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px}
.dthumb{width:100%;border-radius:8px;display:block;border:0}
.dline1{font-size:15px;font-weight:bold;margin:12px 0 4px 0}
.dline2{font-size:14px;margin:0 0 8px 0}
.dline2 b{color:var(--red)}
.dpred{font-size:14px;margin:0 0 8px 0;color:var(--muted)}
.dpred b{color:var(--red)}
.dpred .parrow{color:var(--muted);margin:0 4px}
.trend{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.trend.rising{background:#fde8e8;color:#c81e1e}
.trend.breakout{background:#e6f4ea;color:#137333}
.trend.peaked{background:#f1f3f4;color:#5f6368}
.trend.flat{background:#f1f3f4;color:#80868b}
.trendlegend{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 0 12px 0;font-size:13px;line-height:1.9;color:var(--text)}
.trendlegend .tl{font-weight:800;margin-bottom:2px}
.dtitle{font-size:15px;font-weight:bold;line-height:1.5;margin:0 0 4px 0}
.dtitle a{color:var(--text);text-decoration:none}
.dzh{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 8px 0}
.dmeta{font-size:13px;color:var(--muted);margin:0}
.dline1 b{color:var(--red)}
/* 前三名特效：金 / 银 / 铜 */
.dcard.top1{border-color:#d4a017;box-shadow:0 0 0 1px #d4a017,0 4px 18px rgba(212,160,23,.28)}
.dcard.top2{border-color:#9ca3af;box-shadow:0 0 0 1px #9ca3af,0 4px 18px rgba(156,163,175,.28)}
.dcard.top3{border-color:#b87333;box-shadow:0 0 0 1px #b87333,0 4px 18px rgba(184,115,51,.28)}
.rankcard.top1{border-color:#d4a017;box-shadow:0 0 0 1px #d4a017,0 4px 18px rgba(212,160,23,.28)}
.rankcard.top2{border-color:#9ca3af;box-shadow:0 0 0 1px #9ca3af,0 4px 18px rgba(156,163,175,.28)}
.rankcard.top3{border-color:#b87333;box-shadow:0 0 0 1px #b87333,0 4px 18px rgba(184,115,51,.28)}
.wordrow.top1{border-color:#d4a017;box-shadow:0 0 0 1px #d4a017,0 4px 18px rgba(212,160,23,.28)}
.wordrow.top2{border-color:#9ca3af;box-shadow:0 0 0 1px #9ca3af,0 4px 18px rgba(156,163,175,.28)}
.wordrow.top3{border-color:#b87333;box-shadow:0 0 0 1px #b87333,0 4px 18px rgba(184,115,51,.28)}
.dline1.top1{color:#b8860b}
.dline1.top2{color:#6b7280}
.dline1.top3{color:#92400e}
@media(max-width:480px){
  .vtitle{font-size:19px}
  .stat .num{font-size:20px}
  .stats{gap:8px}
  .stat{padding:12px 4px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
<h1 id="page-title">YouTube 数据看板</h1>
<div class="langicon" id="langicon" title="切换语言">中 / EN</div>
</div>
<div class="updated" id="updated-line">数据更新于 2026-11-08T00:55:27+08:00</div>
<input class="search" id="search" placeholder="🔍 搜索标题关键词...">
<div id="mainview" class="pageview">
<div class="tabs" id="tabs"></div>
<div id="list-controls">
<div class="stats" id="stats"></div>
<div class="chanlink" id="chanlink"></div>
<div class="sortrow" id="sortrow"></div>
</div>
<div id="list"></div>
</div>
<div id="rankview" class="pageview hidden">
  <div id="ranklist"></div>
</div>
<div id="insightview" class="pageview hidden">
  <div id="insightlist"></div>
</div>
<div class="footer" id="footer"></div>
<div class="glassbar" id="glassbar">
  <div class="seg" id="g-seg">
    <div class="thumb" id="g-thumb"></div>
    <button id="g-list" class="on">列表</button>
    <button id="g-rank">📈 涨幅榜</button>
    <button id="g-insight">💡 数据洞察</button>
  </div>

<script>

ce dripping with venom: \"Did you fall so low after leaving me, Elena? Did you end up this pathetic without my money?\" With cruel arrogance, he reached out and violently ripped my hair.\n\nWith a sickening tear, the crimson wig flew into the muddy gravel, landing among dead leaves and burnt incense ash—exposing my bare, shaved skull and the stark purple surgical incision crosshatched across my skin.\n\nAdrian froze, the color draining from his face as his eyes locked onto my bald head, my hospital envelope labeled \"Terminal Recurrent Glioblastoma,\" and the cemetery deed in my hands. But before he could speak, I looked up with a deadpan smile and extended my phone: \"Two hundred and fifty dollars, you absolute jerk. Pay up.\"\n\nHe didn't know the horrifying truth.\n\nThree years ago, when Adrian believed I took a five-hundred-thousand-dollar buyout from his ruthless father and vanished, I was actually dying on an emergency operating table with status epilepticus. I spent thirty days comatose, waking up with my memories wiped clean, an uncashed check I never spent, and hundreds of venomous messages from a stranger ending in 8888 whom I blocked as a scammer.\n\nNow, with weeks left to live, the billionaire mob boss who spent three years cursing my name discovers that the woman he branded a mercenary traitor never took a single dime of his fortune.\n\nWhen Adrian mobilizes the entire wealth of the Moretti empire, shaving his own head to match mine, peeling ninety-nine unbroken apples to bargain with saints, and putting his own life on the line against syndicate traitors to keep me breathing, the greatest battle of our lives begins. But can fifty million dollars and a repentant Don defeat an incurable clock inside my brain?\n\nIf Elena and Adrian's journey of sacrifice, redemption, and unbreakable love touched your heart, please take a moment to like this video, subscribe to our channel, and share this story with someone who needs a reminder of the power of unconditi prosecutors the billionaire DeLuca heiress abandoned her lawful family!\" \n\nHorrified and shattered by my unprovoked cruelty, my mother threw a certified draft at my feet, declaring: \"Thirty thousand dollars. We are dead to each other.\" My mafia grandfather sneered that an abusive cartel mongrel would always breed filth. \n\nThey never knew the horrifying truth. \n\nIn my first life, I had followed my mother back to Boston. But my presence as a cartel bastard disgraced her in high society, stripped her of her corporate inheritance, and caused her to be ambushed and murdered on the street by my abusive father. Grief-stricken, I carried her ashes back to the mountains, offering my own soul and second lifetime to an ancient dark shaman: a life for a life, so that Sophia DeLuca could be reborn into wealth, dignity, and absolute glory. \n\nAnd that knife wound? It was carefully angled to bleed heavily without severing a tendon—a calculated sacrifice to ensure my mother severed all ties with me, climbed the corporate ladder, and reclaimed her rightful throne as the undisputed CEO of DeLuca Bio-Pharma.\n\nNow, thirteen years later, the cosmic debt has come to collect. I am twenty-five, living in a crumbling East Boston tenement, diagnosed with an inoperable, terminal Grade IV glioblastoma. \n\nWhen my abusive cartel father is released on parole and threatens to butcher Sophia unless I hand over two million dollars, I refuse to let the cycle repeat. I sew a digital voice recorder into my coat lapel, deliberately provoke his murderous rage, and let him plunge his eight-inch blade into my chest while smashing my skull against a cast-iron radiator—rupturing my fatal brain tumor, but locking my dying arms around his legs until tactical police swarm the room.\n\nIn the neuro-ICU at Massachusetts General Hospital, as my brainstem herniates and the monitors begin to flatline, Sophia DeLuca hears the bloody recording. She finds my legal name-change decree, my clean bank ledgers , "published": "2026-10-23", "published_at": "2026-10-23 21:30", "description": "My new boyfriend had just returned from a four-day syndicate summit in Miami. We were tangled on the master suite sofa, breathless, clothing half-shed, lost in an intoxicating reunion.\n\nThen, the unlatched door clicked open.\n\nStanding in the threshold, frozen in tailored navy pinstripes, was Julian DeLuca—the golden heir of the eastern seaboard, the boy I had spent seven years tutoring, bleeding for, and worshipping in high school, only to be kept in the humiliating purgatory of the \"friend zone\" while he chased another heiress.\n\nWhen Julian recognized my face, the color drained from his skin until he looked like a walking corpse. He gripped his leather portfolio so hard his knuckles turned white, forcing out a strained, ghastly whisper: \"Looks like I came at the wrong time.\"\n\nMy boyfriend didn't scramble. He didn't hide.\n\nDante Romano—the lethal, illegitimate sovereign of the five boroughs who called Julian brother—pulled his heavy overcoat over my bare thighs, looked Julian dead in the eye, and deliberately lowered his mouth to my throat. Right in front of the man who had discarded me five years ago, Dante pressed a searing, possessive kiss into the soft hollow of my bare neck: \"Don't be scared, baby. He's my brother. He won't bite.\"\n\nIn that single, electric second, five years of unrequited agony shattered into pure, unadulterated triumph.\n\nJulian had spent half a decade scouring the continent for the quiet tutor who had walked away, hoarding a dried gardenia flower in his glove compartment like a dying monk. Now, watching his closest brother claim my skin, the regret turned into unhinged madness. He crashed his Mercedes into a highway guardrail, weeping blood onto the steering wheel, begging to know if I truly didn't want him anymore. He fabricated fifty-million-dollar maritime contracts just to see my face, and dropped to his knees on my welcome mat in the pouri nd his mistress on a private yacht.\n\nWith the syndicate stock in freefall, I took the podium at an international press conference, announcing that Sean and I had quietly divorced two years ago, shielding the family assets while securing fifteen percent of his voting equity for our unborn twins.\n\nThis channel brings you captivating Mafia Boss romance stories filled with ruthless crime lords, fearless women, forbidden attraction, hidden identities, dangerous secrets, unexpected marriages, betrayal, revenge, and second chances.\n\nBehind every cold and powerful Mafia Boss is a past he refuses to reveal. And sometimes, the one woman he never expected to love becomes the only person capable of breaking through his walls.\n\n#drama #mafia #power #darkromance #bodypositive #emotionalstory #lovestory #mafiaromance #mafiaboss #mafiaking #romancestories #plussizeromance", "tags": ["#drama", "#mafia", "#power", "#darkromance", "#bodypositive", "#emotionalstory", "#lovestory", "#mafiaromance", "#mafiaboss", "#mafiaking", "#romancestories", "#plussizeromance", "MafiaRomance", "DarkRomance", "BadassHeroine", "FemaleLeadRevenge", "BillionaireRomance", "AudioBook", "SchemingHusband", "SovereignWoman", "RetributionStory", "HeartbreakToPower"], "comments_text": [{"author": "@otemoyansan", "text": "Feel good story till end.", "likes": 3, "time": "2026-11-06 17:50", "replies": [{"author": "@Kimiaudiobooks", "text": "So happy you enjoyed it from beginning to end! Thanks for listening!❤", "likes": 0, "time": "2026-11-07 10:53"}]}, {"author": "@juanitawilliams8898", "text": "Karma was not kind to Natalie", "likes": 3, "time": "2026-11-07 00:35", "replies": [{"author": "@Kimiaudiobooks", "text": "Exactly! Thanks for sharing your thoughts!", "likes": 0, "time": "2026-11-07 10:54"}]}, {"author": "@CynthiaBennett-n2p", "text": "SAD AND UNCARING PEOPLE.                WALES❤   UK ❤", "likes": 3, "time": "2026-11-07 03:16", "replies": [{"author": "@Kimiaudiobooks", "text": "Yes, they were t ve argument, I walked out into a freezing rainstorm, fell from the Manhattan Bridge, and woke up in Mount Sinai Hospital with acute concussion and dissociative memory confusion.\n\nInstead of relief, Christian felt delight. Eager to sever all blood ties, he looked across the crowded hospital corridor, pointed at a terminally ill stranger leaning against the wall, and sneered: \"That is your real brother over there. Look carefully, don't scream at me, and never bother me again.\"\n\nAs Christian turned his back and walked away, the pale, dying stranger stepped forward. He did not curse or call security. With astonishing tenderness, he placed his warm palm on my head and whispered: \"Then let's go. Brother is taking you home.\"\n\nThat stranger was Julian Sterling, the brilliant twenty-eight-year-old tech billionaire who had stunned Wall Street by liquidating his empire. But inside his empty, cold modern villa, Julian was silently waiting to die of end-stage congestive heart failure—living alone with prescription sleeping pills and his own framed obituary portrait, grieving the little sister who had taken her life years ago to save him money.\n\nTwo broken souls, discarded by their blood relatives, made a sacred covenant in the dark: to fight for life.\n\nWhen an organ donor match is discovered in Norway, Clara refuses to let Julian die. Discovering that the world's preeminent transplant surgeon, Dr. Robert Wei, is visiting his elderly mother in a snowbound Adirondack valley, Clara treks nine miles alone through a thirty-five-below mountain blizzard, collapsing half-frozen in the snowdrifts to beg for Julian's life.\n\nWhen Christian catches up to them in the mountains, attempting to drag Clara home and mocking the \"dying stranger,\" Clara turns and strikes him across the face, shattering seven years of silence with the truth of their parents' sacrifice.\n\nThis channel brings you captivating Mafia Boss romance stories filled with ruthless crime lords, fearless women, forbidden attraction, hidden identities, dangerous secrets, unexpected marriages, betrayal, revenge, and second chances.\n\nBehind every cold and powerful Mafia Boss is a past he refuses to reveal. And sometimes, the one woman he never expected to love becomes the only person capable of breaking through his walls.\n\n#drama #mafia #power #darkromance #bodypositive #emotionalstory #lovestory #mafiaromance #mafiaboss #mafiaking #romancestories #plussizeromance", "tags": ["#drama", "#mafia", "#power", "#darkromance", "#bodypositive", "#emotionalstory", "#lovestory", "#mafiaromance", "#mafiaboss", "#mafiaking", "#romancestories", "#plussizeromance", "MafiaRomance", "DarkRomance", "EmotionalStory", "FoundFamily", "AudioBook", "RegretTrope", "BillionaireRomance", "RedemptionArc", "SlowBurnRomance", "BrotherRegret"], "comments_text": [{"author": "@Kimiaudiobooks", "text": "From the freezing waters of the East River to the snow-covered fjords of Norway under the Aurora Borealis, this is an emotional, high-stakes female-led Mafia and high-society redemption romance about survivor's guilt, true family, and the courage to live.\n\n\nIf this story touched your heart, please hit the like button, subscribe to the channel, and share your favorite moments in the comments below.", "likes": 2, "time": "2026-11-02 12:25", "replies": []}, {"author": "@jykim3604", "text": "1:11:53 A long overdue slap.  Both Christian and Clara were traumatized by their parents' premature death, but Christian, instead of looking after his younger sister, irrationally blamed her for \"sending them into an earthquake zone\".   Hopefully he and Clara will have a chance to repair their relationship down the road.", "likes": 1, "time": "2026-11-04 09:52", "replies": [{"author": "@Kimiaudiobooks", "text": "Appreciate you taking the time to read this!❤", "likes": 2, "time": "2026-11-04 11:49"}]}], "hot": false, "prev_views": 219, "prev_likes": 7, "prev_comments": 3, "tpower": 2266, "fresh": 0.53, "quote": 1, ": "1:37:29", "published": "2026-10-28", "published_at": "2026-10-28 20:00", "description": "\"Drop the gun, Elena!\" my childhood sweetheart Ethan Vance roared through the midnight downpour on the thirtieth-floor rooftop, his police service weapon aimed straight at my heart. Soaked in a blood-red evening gown, I pressed my black pistol hard against the temple of his gentle psychologist fiancee, Chloe Sterling, and laughed into the storm as I forced him to choose between my life and the woman he had sworn to protect. When I counted to three and pulled the trigger, Ethan's bullet tore straight through my left chest. Yet as I collapsed into the bloody puddles and smiled up at him—\"Good shot, Captain Vance\"—the pistol that slipped from my numb fingers revealed an empty magazine without a single bullet inside, and a firing pin that had been filed completely flat.\n\nFor ten agonizing years, Ethan Vance believed I was the ruthless orphan who had betrayed our high school promise to become the blood-stained queen of the Night Owl Syndicate. He never knew that the night my father and his narcotics-detective dad died ten years ago, I had swallowed a lethal capsule and let the real mastermind—his \"innocent\" fiancee Chloe Sterling—implant a micro-toxin bomb onto my heart valve so Ethan would be spared. Every syndicate lieutenant Ethan arrested to become the youngest task force captain in Harbor City had been fed to his gun by my hands from the dark.\n\nAnd tonight, forcing the man I loved to shoot me through the chest was the only way to stop my heart on an operating table long enough for him to discover the military titanium drive hidden over my ribs—exposing the monster sleeping beside his pillow and burning the entire cartel empire to ashes before dawn.\n\nThis channel brings you captivating Mafia Boss romance stories filled with ruthless crime lords, fearless women, forbidden attraction, hidden identities, dangerous secrets, unexpected marriages, betrayal, revenge, and ance", "#bodypositive", "#emotionalstory", "#lovestory", "#mafiaromance", "#mafiaboss", "#mafiaking", "#romancestories", "#plussizeromance", "#MafiaRomance", "#Audiobook", "#RevengeStory", "#AgeGapRomance", "#DarkRomance", "#AlphaMale", "#BillionaireRomance", "#FullAudiobook"], "comments_text": [{"author": "@Kimiaudiobooks", "text": "Did Elena make the right choice by calling Dante, or did Julian get what he deserved? What was your favorite moment of revenge in this story? Let us know in the comments below! If you enjoyed this dark romance audio story, please like, subscribe, and hit the notification bell for more full-length romantic audiobooks every week!", "likes": 0, "time": "2026-10-23 19:35", "replies": []}], "hot": false, "prev_views": 69, "prev_likes": 1, "prev_comments": 1, "tpower": 2909, "fresh": 0.302, "quote": 1, "pred": 50751, "pred_daily": 21, "pred_daily_tm": 19, "pred_tomorrow_total": 92}, {"id": "aOO5JY-Vs0o", "title": "\"Don't Tell Her I Have A Girl, She'll Cry\"—And Cruel Laughter Pierced My Ten-Year Heart", "views": 324, "likes": 8, "comments": 2, "duration": "1:25:25", "published": "2026-10-21", "published_at": "2026-10-21 20:30", "description": "Description\nFor ten years, I was the loyal shadow behind Adrian Bellini, the untouchable heir to New York's most feared family. I gave him my youth, bandaged his wounds in the dead of night, and managed his empire while silently holding a love I never dared to confess. But the night I finally gathered the courage to give him a watch engraved with a decade of memories, I stood outside his private club booth—only to watch him kiss a glamorous model against the leather sofa.\n\nWhen his associates asked what would happen to me, Adrian merely tapped the ash from his cigarette and warned them with a lazy, arrogant smirk: \"Keep your mouths shut. Don't tell Elena I have a girlfriend. She loves me so much, she'll cry her eyes out.\" In that moment, as a tray of champagne shattered across the floor and cruel const memCache = {}, inflight = {};
function djb2(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}
function ckey(s){return 'tr_'+djb2(s)+'_'+s.length}

async function translateText(text){
  if(!text||!text.trim())return text;
  const key=ckey(text);
  const hit=cacheGet(key);
  if(hit!==undefined)return hit==='__FAIL__'?'':hit;
  if(inflight[key])return inflight[key];
  const p=(async()=>{
    try{
      const chunks=[];let s=text;
      while(s.length>1800){let i=s.lastIndexOf('\n',1800);if(i<0)i=1800;chunks.push(s.slice(0,i));s=s.slice(i)}
      chunks.push(s);
      const out=[];
      for(const c of chunks){
        const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(c);
        const r=await fetch(url);if(!r.ok)throw new Error('gtx '+r.status);
        const j=await r.json();
        out.push((j[0]||[]).map(x=>x[0]||'').join(''));
      }
      const res=out.join('');cacheSet(key,res);return res;
    }catch(e){
      try{
        const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair=en|zh-CN';
        const r=await fetch(url);const j=await r.json();
        if(j.responseData&&j.responseData.translatedText){cacheSet(key,j.responseData.translatedText);return j.responseData.translatedText}
      }catch(e2){}
      cacheSet(key,'__FAIL__');return '';
    }finally{delete inflight[key]}
  })();
  inflight[key]=p;return p;
}

      const showDaily = dailyShowAll ? dvids : dvids.slice(0,10);
      h+=showDaily.map((v,i)=>{
        const rn=['榜一','榜二','榜三','榜四','榜五','榜六','榜七','榜八','榜九','榜十'][i]||('第 '+(i+1)+' 名');
        const topCls = i===0?'top1':(i===1?'top2':(i===2?'top3':''));
        const medal = i===0?'🥇 ':(i===1?'🥈 ':(i===2?'🥉 ':''));
        const subStr = (v.dsubs!=null) ? ' · 订阅 ' + fmtNum(v.subs||0) + ' (<b>+' + fmtNum(v.dsubs) + '</b>)' : '';
        const trendMap = {rising:t().trendRising, breakout:t().trendBreakout, peaked:t().trendPeaked, flat:t().trendFlat};

          card+=`<div style="text-align:center;margin:10px 0"><button class="sortpill" data-rcexpand="${esc(v.id)}">${cOpen?t().collapseAll:t().expandAll.replace('{n}',ct.length)}</button></div>`;
        }
        card+=`<a class="ytwatch" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">${t().watch}</a>`;
        card+=`</div>`;
      }
      card+=`</div>`;
      return card;
    }).join('');
  }
  el.innerHTML=h;
  el.querySelectorAll('.rankcard').forEach(card=>{
    card.onclick=(e)=>{
      if(e.target.closest('a'))return;

  el.querySelectorAll('[data-rcexpand]').forEach(b=>b.onclick=(e)=>{

  if(titleTransOn)translateTitlesDom(el);
  el.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{rankTab=b.dataset.rt;renderRank()});
}

function chanVideos(){

    const out=[];
    (DATA.channels||[]).forEach((c,ci)=>{(c.videos||[]).forEach(v=>{const cp=Object.assign({},v);cp._chan=c.name;cp._chanIdx=ci;out.push(cp)})});

function renderStats(){
  let subs=null, prevSubs=null, vs, chanUrl='', handle='';
  if(curChan===-1){
    vs=chanVideos();
    subs=(DATA.channels||[]).reduce((a,c)=>a+(c.subs||0),0);
    prevSubs=(DATA.channels||[]).reduce((a,c)=>a+(c.prev_subs||0),0);
    if(!(DATA.channels||[]).some(c=>c.prev_subs!=null))prevSubs=null;
    handle='all';
  }else{
    const c=chan();vs=c.videos||[];
    subs=c.subs;prevSubs=c.prev_subs;chanUrl=c.url||'';
    handle='@'+String(chanUrl).split('/').pop();
  }
  const tot=vs.reduce((a,v)=>a+(v.views||0),0);
  const prevTot=vs.reduce((a,v)=>a+(v.prev_views||0),0);
  const hasPrevTot=vs.some(v=>v.prev_views!=null);
  const avg=vs.length?Math.round(tot/vs.length):0;
  const dSubs=(subs!=null&&prevSubs!=null)?subs-prevSubs:null;
  const dTot=hasPrevTot?tot-prevTot:null;
  const dBadge=d=>(d!=null&&d>0)?`<div><span class="delta">+${fmtNum(d)}</span></div>`:'';
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="num">${fmtW(subs)}</div>${dBadge(dSubs)}<div class="label">${t().subs}</div></div>
    <div class="stat"><div class="num">${vs.length}</div><div class="label">${t().videos}</div></div>
    <div class="stat"><div class="num">${fmtW(tot)}</div>${dBadge(dTot)}<div class="label">${t().totalViews}</div></div>
    <div class="stat"><div class="num">${fmtW(avg)}</div><div class="label">${t().avgViews}</div></div>`;
  document.getElementById('chanlink').innerHTML = curChan===-1 ? '' : `${esc(handle)} · <a href="${esc(chanUrl||'#')}" target="_blank" rel="noopener">${t().openChan}</a>`;
}

async function translateTitlesDom(scope){
  const els=(scope||document).querySelectorAll('.vtitle[data-orig-title]:not([data-translated="1"]),.ranktitle[data-orig-title]:not([data-translated="1"]),.ititle[data-orig-title]:not([data-translated="1"])');
  for(const el of els){
    const orig=el.getAttribute('data-orig-title');
    if(!orig)continue;
    const tr=await translateText(orig);
    if(tr){
      // 保留所有徽章（爆款、新发布）
      const badges=[...el.querySelectorAll('.badge-hot,.badge-new')].map(b=>b.outerHTML).join('');
      el.innerHTML=badges+esc(tr);
      el.setAttribute('data-translated','1');
    }
  }

  let isNew='';
  try{
    const today=new Date().toISOString().slice(0,10);
    if(v.published===today)isNew=`<span class="badge-new c-purple">${t().isNew}</span>`;
  }catch(e){}
  const chanTag=(curChan===-1&&v._chan)?`<div class="chan-tag c${(v._chanIdx||0)%4}">${esc(v._chan)}</div>`:'';
  const titleShow=esc(v.title||'');
  const statsRow=`<div class="vstats"><span class="vstat"><span class="vlab">${t().plays}</span> <b>${fmtNum(v.views)}</b>${deltaHtml(v,'views')}</span><span class="vstat"><span class="vlab">${t().likes}</span> <b>${fmtNum(v.likes)}</b>${deltaHtml(v,'likes')}</span><span class="vstat"><span class="vlab">${t().comments}</span> <b>${fmtNum(v.comments)}</b>${deltaHtml(v,'comments')}</span></div>`;
  const predRow=(v.pred_daily!=null)?`<p class="dpred">🔮 ${t().predToday} <b>+${fmtNum(v.pred_daily||0)}</b><span class="parrow">→</span>${t().predTomorrow} <b>${fmtNum(v.pred_tomorrow_total||0)}</b></p>`:'';
  const footRow=`<div class="vfoot"><span class="vfoot-l">${esc(v.duration||'—')}</span><span class="vfoot-c">${esc(v.published_at||v.published||'—')}</span><span class="vfoot-r toggle" data-id="${esc(v.id)}">${open?t().collapse+' ▲':t().detail+' ▼'}</span></div>`;
  let body=`<div class="vbody">`;
  body+=`<div class="dlabel">${t().desc}</div><div class="dtext" data-translate data-orig="${esc(v.description||'')}">${v.description?esc(v.description):'—'}</div>`;
  if(v.tags&&v.tags.length)body+=`<div class="tags">${v.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div>`;
  if(v.note)body+=`<div class="note">${t().note}：${esc(v.note)}</div>`;
  const ct=v.comments_text||[];
  const cOpen=commentsOpen.has(v.id);
  const showCt=cOpen?ct:ct.slice(0,5);
  body+=`<div class="ctitle">${t().commentsTitle} ${t().captured(ct.length, v.comments==null?'—':fmtNum(v.comments))}</div>`;
  body+=showCt.length?showCt.map(commentHtml).join(''):`<div class="note">—</div>`;
  if(ct.length>5){
    body+=`<div style="text-align:center;margin:10px 0"><button class="sortpill" data-cexpand="${esc(v.id)}">${cOpen?t().collapseAll:t().expandAll.replace('{n}',ct.length)}</button></div>`;
  }
  body+=`<a class="ytwatch" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">${t().watch}</a>`;
  body+=`<div style="text-align:center;margin-top:12px"><span class="toggle" data-collapse="${esc(v.id)}">${t().collapse} ▲</span></div>`;
  body+='</div>';
  return `<div class="video${open?' open':''}" data-vid="${esc(v.id)}"><div class="vhead">${chanTag}<div class="vtitle" data-orig-title="${esc(v.title||'')}">${hot}${isNew}${titleShow}</div>${statsRow}${predRow}${footRow}</div>${body}</div>`;
}
function renderList(){
  const vs=filteredVideos();
  const el=document.getElementById('list');
  if(!vs.length){el.innerHTML=`<div class="noresult">${t().noResult}</div>`;return}
  el.innerHTML=vs.map(videoHtml).join('');
  el.querySelectorAll('.vhead').forEach(h=>h.onclick=(e)=>{
    if(e.target.closest('a'))return;
    const id=h.parentElement.dataset.vid;
    openSet.has(id)?openSet.delete(id):openSet.add(id);
    renderList();
    if(openSet.has(id)&&lang==='zh')translateOpen(h.parentElement);
  });
  el.querySelectorAll('.toggle').forEach(tg=>tg.onclick=(e)=>{
    e.stopPropagation();
    const id=tg.dataset.id;
    openSet.has(id)?openSet.delete(id):openSet.add(id);
    renderList();
    if(openSet.has(id)&&lang==='zh'){const card=el.querySelector(`[data-vid="${CSS.escape(id)}"]`);if(card)translateOpen(card)}
  });
  el.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=b.dataset.collapse;
    openSet.delete(id);
    renderList();
  });
  el.querySelectorAll('[data-cexpand]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=b.dataset.cexpand;
    commentsOpen.has(id)?commentsOpen.delete(id):commentsOpen.add(id);
    renderList();
  });
  if(lang==='zh')translateVisible();
  if(titleTransOn)translateTitlesDom(el);
}
async function translateOpen(card){
  const els=card.querySelectorAll('[data-translate]');
  for(const el of els){
    const orig=el.getAttribute('data-orig')||'';
    if(!orig||el.dataset.done)continue;
    el.dataset.done='1';
    el.innerHTML=esc(orig)+` <span class="translating">${t().translating}</span>`;
    const tr=await translateText(orig);
    if(tr){el.innerHTML=esc(tr)+` <span class="translated-tag">${t().translated}</span>`}
    else{el.innerHTML=esc(orig)+(t().transFail?` <span class="translating">${esc(t().transFail)}</span>`:'')}
  }
}
async function translateVisible(){
  document.querySelectorAll('.video.open').forEach(translateOpen);
}
function applyLang(){
  document.getElementById('langicon').textContent = lang==='zh' ? '中 / EN' : 'EN / 中';
  document.getElementById('page-title').textContent=t().pageTitle;
  document.title=t().pageTitle;
  document.getElementById('updated-line').textContent=`${t().updated} ${fmtUpdated('2026-11-08T00:55:27+08:00')}`;
  document.getElementById('search').placeholder=t().search;
  document.getElementById('g-list').textContent=t().listView;
  document.getElementById('g-rank').textContent=t().rankBtn;
  document.getElementById('g-insight').textContent=t().insightView;
  const btt=document.getElementById('btn-trans-title');
  if(btt)btt.textContent=titleTransOn?t().transTitleOn:t().transTitle;
  document.getElementById('footer').textContent=t().footer;
  try{localStorage.setItem('dash-lang',lang)}catch(e){}
  renderAll();
  if(curView==='insight')renderInsights();
}
function renderAll(){renderTabs();renderStats();renderSort();renderList()}
document.getElementById('langicon').onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang()};
function moveThumb(){
  const seg=document.getElementById('g-seg');
  const thumb=document.getElementById('g-thumb');
  const btn=curView==='rank'?document.getElementById('g-rank'):curView==='insight'?document.getElementById('g-insight'):document.getElementById('g-list');
  if(!seg||!thumb||!btn)return;
  thumb.style.left=btn.offsetLeft+'px';
  thumb.style.width=btn.offsetWidth+'px';
}
function showView(name){
  if(curView===name)return;
  savedScroll[curView]=window.scrollY;
  const prev=curView;
  curView=name;
  document.getElementById('g-list').classList.toggle('on',name==='list');
  document.getElementById('g-rank').classList.toggle('on',name==='rank');
  document.getElementById('g-insight').classList.toggle('on',name==='insight');
  moveThumb();
  const views={list:document.getElementById('mainview'),rank:document.getElementById('rankview'),insight:document.getElementById('insightview')};
  const fromEl=views[prev], toEl=views[name];
  fromEl.classList.add('flip-out');
  setTimeout(()=>{
    fromEl.classList.add('hidden');fromEl.classList.remove('flip-out');
    toEl.classList.remove('hidden');toEl.classList.add('flip-in');
    if(name==='rank')renderRank();
    if(name==='list')renderList();
    if(name==='insight')renderInsights();
    requestAnimationFrame(()=>requestAnimationFrame(()=>toEl.classList.remove('flip-in')));
    window.scrollTo(0,savedScroll[name]||0);
  },320);
}
function showRank(){showView('rank')}
function showMain(){showView('list')}
function showInsight(){showView('insight')}
document.getElementById('g-list').onclick=showMain;
document.getElementById('g-rank').onclick=showRank;
document.getElementById('g-insight').onclick=showInsight;
// 分段器：滑动 thumb 切换
(function(){
  const seg=document.getElementById('g-seg');
  let startX=0, dragging=false;
  // 初始化 thumb 位置
  function init(){ moveThumb(); }
  if(document.readyState==='complete')init();
  else window.addEventListener('load',init);
  setTimeout(init,100);
  seg.addEventListener('touchstart',e=>{
    dragging=true; startX=e.touches[0].clientX;
  },{passive:true});
  seg.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dx=e.touches[0].clientX-startX;
    // 滑动超过 30px 就切换
    const order=['list','rank','insight'];
    if(dx<-30){const i=order.indexOf(curView);if(i>=0&&i<order.length-1){dragging=false;showView(order[i+1])}}
    else if(dx>30){const i=order.indexOf(curView);if(i>0){dragging=false;showView(order[i-1])}}
  },{passive:true});
  seg.addEventListener('touchend',()=>{dragging=false},{passive:true});
})();
// 液态玻璃条：上下滑收起/出现（Apple Music 逻辑）
(function(){
  const bar=document.getElementById('glassbar');
  let lastY=window.scrollY, barHidden=false, ticking=false;
  function onScroll(){
    const y=window.scrollY;
    if(y>lastY+4 && y>120 && !barHidden){
      barHidden=true;
      bar.style.transition='transform .3s ease, opacity .3s ease';
      bar.style.transform='translateX(-50%) translateY(90px)';
      bar.style.opacity='0';
      bar.style.pointerEvents='none';
    }else if(y<lastY-4 && barHidden){
      barHidden=false;
      bar.style.transition='transform .3s ease, opacity .3s ease';
      bar.style.transform='translateX(-50%)';
      bar.style.opacity='1';
      bar.style.pointerEvents='auto';
    }
    lastY=y; ticking=false;
  }
  window.addEventListener('scroll',()=>{
    if(!ticking){ticking=true;requestAnimationFrame(onScroll)}
  },{passive:true});
})();
document.getElementById('search').oninput=(e)=>{query=e.target.value.trim();renderList()};
applyLang();
</script>
