<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>作业粉碎机 · 专治作业气</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #1a1033; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #fff; }
  #app { position: relative; width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto; overflow: hidden; background: linear-gradient(180deg, #2b1650 0%, #1a1033 55%, #241040 100%); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
  .hidden { display: none !important; }
  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }

  /* ---- 开始页 ---- */
  #startScreen { padding: 18px 20px 26px; text-align: center; overflow-y: auto; }
  .tag { font-size: 13px; color: #ffd94d; letter-spacing: 2px; margin-top: 6px; }
  h1 { font-size: 44px; line-height: 1.15; margin: 6px 0 2px; text-shadow: 0 4px 0 #b31b4a, 0 8px 18px rgba(0,0,0,.5); }
  h1 span { color: #ffd94d; }
  .sub { font-size: 15px; color: #d9c8ff; margin-bottom: 10px; }
  .hero { width: 220px; height: 220px; border-radius: 50%; background: #fff; border: 5px solid #ffd94d; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45); flex-shrink: 0; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .teacher-row { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; }
  .teacher-row img { width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 3px solid #ff5a5a; object-fit: cover; }
  .bubble { position: relative; background: #fff; color: #333; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 14px; text-align: left; }
  .bubble::before { content: ""; position: absolute; left: -8px; top: 50%; margin-top: -7px; border: 7px solid transparent; border-right-color: #fff; border-left: 0; }
  .rules { width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-size: 14px; line-height: 1.9; text-align: left; }
  .rules b { color: #ffd94d; }
  .big-btn { width: 100%; padding: 16px; font-size: 22px; font-weight: 900; color: #4a1500; background: linear-gradient(180deg, #ffe066, #ffb400); border: none; border-radius: 999px; box-shadow: 0 6px 0 #c77f00, 0 10px 20px rgba(0,0,0,.4); cursor: pointer; letter-spacing: 2px; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c77f00; }
  .best { margin-top: 12px; font-size: 14px; color: #b9aed6; }

  /* ---- 游戏页 ---- */
  #gameScreen { background: linear-gradient(180deg, #241040 0%, #1a1033 100%); }
  #hud { width: 100%; padding: 10px 12px 6px; }
  .hud-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hud-box { background: rgba(255,255,255,.1); border-radius: 10px; padding: 6px 10px; font-size: 15px; font-weight: 800; }
  .hud-box small { display: block; font-size: 11px; color: #b9aed6; font-weight: 400; }
  #scoreBox { color: #ffd94d; font-size: 22px; min-width: 96px; }
  #timeBox { color: #7df9c9; font-size: 22px; min-width: 64px; text-align: center; }
  #timeBox.low { color: #ff5a5a; animation: blink .5s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: .4; } }
  .icon-btn { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff; font-size: 18px; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; }
  .bar-wrap { margin-top: 8px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: #d9c8ff; margin-bottom: 3px; }
  .bar { height: 12px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; transition: width .25s; }
  #stressFill { width: 100%; background: linear-gradient(90deg, #ff5a5a, #ff8a3d); }
  #comboTag { position: absolute; top: 96px; right: 12px; z-index: 30; font-size: 18px; font-weight: 900; color: #ffd94d; text-shadow: 0 2px 0 #b31b4a; transform: rotate(4deg); }
  #field { position: relative; flex: 1; width: 100%; overflow: hidden; touch-action: none; }
  .item { position: absolute; cursor: pointer; user-select: none; -webkit-user-select: none; will-change: transform; }
  .paper { width: 84px; height: 108px; background: linear-gradient(180deg, #fffef8, #f4ecd2); border-radius: 6px; box-shadow: 0 6px 14px rgba(0,0,0,.45); padding: 8px 7px; color: #333; }
  .paper .subj { font-size: 19px; font-weight: 900; text-align: center; }
  .paper .lines { margin-top: 6px; height: 58px; background: repeating-linear-gradient(180deg, transparent 0 12px, #bcd3f5 12px 13px); border-left: 2px solid #ff9d9d; padding-left: 5px; font-size: 10px; color: #7a6a9a; line-height: 13px; overflow: hidden; }
  .paper.gold { background: linear-gradient(180deg, #fff6c9, #ffd94d); box-shadow: 0 0 18px #ffd94d, 0 6px 14px rgba(0,0,0,.45); }
  .paper.gold .subj { color: #8a5a00; }
  .face { width: 92px; height: 92px; border-radius: 50%; background: #fff; border: 4px solid #ff5a5a; overflow: hidden; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
  .face img { width: 100%; height: 100%; object-fit: cover; }
  .face.monster { border-color: #b06bff; }
  .face .hp { position: absolute; top: -8px; right: -6px; background: #ff5a5a; color: #fff; font-size: 12px; font-weight: 900; border-radius: 99px; padding: 2px 7px; }
  .face-wrap { position: relative; text-align: center; }
  .face-tag { display: inline-block; margin-top: 4px; background: #ff5a5a; color: #fff; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 99px; }
  .face-tag.monster { background: #b06bff; }
  .bomb { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ffd9ec 60%, #ff9ecf); border: 4px solid #ff5aa0; box-shadow: 0 0 20px #ff5aa0, 0 6px 14px rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 34px; }
  .bomb span { font-size: 11px; font-weight: 900; color: #a1005a; }
  .crack { animation: crackshake .18s; }
  @keyframes crackshake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) scale(1.06); } 75% { transform: rotate(6deg) scale(1.06); } }
  .popup { position: absolute; z-index: 40; font-size: 22px; font-weight: 900; color: #ffd94d; text-shadow: 0 2px 0 #b31b4a, 0 3px 8px rgba(0,0,0,.5); pointer-events: none; animation: floatUp .9s ease-out forwards; white-space: nowrap; }
  .popup.bad { color: #ff5a5a; }
  .popup.big { font-size: 30px; }
  @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1.25); } }
  .bit { position: absolute; z-index: 25; width: 10px; height: 14px; background: #fff; pointer-events: none; animation: bitfly .7s ease-out forwards; }
  @keyframes bitfly { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
  #flash.go { animation: flashgo .35s; }
  @keyframes flashgo { 0% { opacity: .7; } 100% { opacity: 0; } }
  #pauseOverlay { position: absolute; inset: 0; z-index: 60; background: rgba(20,8,40,.75); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 20px; font-weight: 900; }
  #pauseOverlay button { padding: 12px 34px; font-size: 18px; font-weight: 900; border-radius: 999px; border: none; background: #ffd94d; color: #4a1500; cursor: pointer; }

  /* ---- 结算页 ---- */
  #endScreen { padding: 20px; text-align: center; overflow-y: auto; }
  .chill { width: 210px; height: 210px; border-radius: 50%; background: #fff; border: 5px solid #7df9c9; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45); margin-top: 8px; flex-shrink: 0; }
  .chill img { width: 100%; height: 100%; object-fit: cover; }
  #finalScore { font-size: 56px; font-weight: 900; color: #ffd94d; text-shadow: 0 4px 0 #b31b4a; line-height: 1.1; }
  #rankTitle { font-size: 24px; font-weight: 900; color: #7df9c9; margin: 4px 0 8px; }
  #endLine { font-size: 15px; color: #d9c8ff; line-height: 1.7; margin-bottom: 16px; }
  .stat-row { display: flex; gap: 10px; width: 100%; margin-bottom: 16px; }
  .stat { flex: 1; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 10px 4px; }
  .stat b { display: block; font-size: 22px; color: #ffd94d; }
  .stat span { font-size: 12px; color: #b9aed6; }
</style>
</head>
<body>
<div id="app">
  <!-- 开始页 -->
  <div id="startScreen" class="screen">
    <div class="tag">✏️ 专治作业气 · 60 秒发泄局</div>
    <h1>作业<span>粉碎机</span></h1>
    <div class="sub">数学题、试卷、练习册……统统给我撕碎！</div>
    <div class="hero"><img src="img/hero.webp" alt="主角"></div>
    <div class="teacher-row">
      <img src="img/teacher.webp" alt="老师">
      <div class="bubble">不许撕作业！……你，你别过来啊！</div>
    </div>
    <div class="rules">
      📄 <b>点作业纸</b>撕掉它，得分！连击越多分越高<br>
      🌟 <b>金卷</b>+50 分，<b>试卷怪</b>要点两下，+30 分<br>
      🧽 <b>橡皮擦炸弹</b>一点就清场，全场都算分<br>
      👩‍🏫 <b>千万别点老师</b>，被抓到扣 20 分！<br>
      😮‍💨 压力条清零，直接 +500 分大奖励
    </div>
    <button class="big-btn" id="startBtn">开始发泄！</button>
    <div class="best" id="bestLine">最高分：0</div>
  </div>

  <!-- 游戏页 -->
  <div id="gameScreen" class="screen hidden">
    <div id="hud">
      <div class="hud-row">
        <div class="hud-box" id="scoreBox"><small>分数</small><span id="score">0</span></div>
        <div class="hud-box" id="timeBox"><small>时间</small><span id="time">60</span></div>
        <button class="icon-btn" id="soundBtn" title="声音">🔊</button>
        <button class="icon-btn" id="pauseBtn" title="暂停">⏸</button>
      </div>
      <div class="bar-wrap">
        <div class="bar-label"><span>😤 压力值</span><span id="stressText">100%</span></div>
        <div class="bar"><div id="stressFill"></div></div>
      </div>
    </div>
    <div id="comboTag" class="hidden"></div>
    <div id="field"></div>
    <div id="flash"></div>
    <div id="pauseOverlay" class="hidden">
      <div>⏸ 暂停中</div>
      <div style="font-size:14px;color:#d9c8ff;font-weight:400">作业不会自己消失，但你可以先喘口气</div>
      <button id="resumeBtn">继续撕！</button>
    </div>
  </div>

  <!-- 结算页 -->
  <div id="endScreen" class="screen hidden">
    <div class="tag">🎉 60 秒发泄完毕</div>
    <div class="chill"><img src="img/chill.webp" alt="放松"></div>
    <div id="finalScore">0</div>
    <div id="rankTitle">撕纸能手</div>
    <div id="endLine"></div>
    <div class="stat-row">
      <div class="stat"><b id="statTorn">0</b><span>撕掉作业</span></div>
      <div class="stat"><b id="statCombo">0</b><span>最高连击</span></div>
      <div class="stat"><b id="statBest">0</b><span>历史最高</span></div>
    </div>
    <button class="big-btn" id="againBtn">再来一局！</button>
    <div class="best">作业还在，明天再说。先好好睡一觉 😴</div>
  </div>
</div>

<script>
(function () {
  var field = document.getElementById('field');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var timeBox = document.getElementById('timeBox');
  var stressFill = document.getElementById('stressFill');
  var stressText = document.getElementById('stressText');
  var comboTag = document.getElementById('comboTag');
  var flashEl = document.getElementById('flash');
  var app = document.getElementById('app');

  var SUBJECTS = [
    { name: '数学', eq: '3x+5=20\nx= ?' },
    { name: '语文', eq: '默写古诗\n《静夜思》' },
    { name: '英语', eq: 'apple = ?\nI ___ a student' },
    { name: '试卷', eq: '期末考试\n100分制' },
    { name: '练习册', eq: '第5页\n第6页 第7页' },
    { name: '作文', eq: '《我的妈妈》\n800字' }
  ];
  var TAUNTS = ['撕！', '去你的数学题！', '拜拜了您嘞！', '纸片飞舞！', '再来一张！', '爽！', '粉碎！', '作业去死吧！'];
  var TEAR_VOICES = ['tear1', 'tear2', 'tear3'];

  var running = false, paused = false, soundOn = true;
  var score = 0, combo = 0, maxCombo = 0, torn = 0, stress = 100;
  var timeLeft = 60, lastTs = 0, spawnAcc = 0, comboTimer = 0, lastVoice = 0;
  var items = [], rafId = 0;

  var audioCtx = null;
  function ac() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function noiseBurst(dur, freq, gain) {
    if (!soundOn) return; var c = ac(); if (!c) return;
    var len = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    var g = c.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  }
  function tone(f0, f1, dur, type, gain) {
    if (!soundOn) return; var c = ac(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), c.currentTime + dur);
    g.gain.setValueAtTime(gain || 0.25, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  }
  var sfxRip = function () { noiseBurst(0.18, 1800, 0.5); tone(300, 90, 0.12, 'triangle', 0.15); };
  var sfxPop = function () { tone(700, 180, 0.12, 'sine', 0.3); };
  var sfxDing = function () { tone(880, 880, 0.12, 'sine', 0.25); setTimeout(function () { tone(1318, 1318, 0.18, 'sine', 0.25); }, 90); };
  var sfxBoom = function () { tone(160, 35, 0.5, 'sine', 0.5); noiseBurst(0.4, 300, 0.5); };
  var sfxBad = function () { tone(220, 110, 0.35, 'sawtooth', 0.2); };

  var voices = {};
  ['start', 'tear1', 'tear2', 'tear3', 'ouch', 'bomb', 'win', 'monster'].forEach(function (n) {
    var a = new Audio('sfx/' + n + '.mp3'); a.preload = 'auto'; voices[n] = a;
  });
  function playVoice(name) {
    if (!soundOn) return;
    var now = Date.now();
    if (now - lastVoice < 1500) return;
    lastVoice = now;
    var a = voices[name];
    if (a) { try { a.currentTime = 0; a.play(); } catch (e) {} }
  }

  function showPopup(x, y, text, cls) {
    var p = document.createElement('div');
    p.className = 'popup' + (cls ? ' ' + cls : '');
    p.textContent = text;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    field.appendChild(p);
    setTimeout(function () { p.remove(); }, 950);
  }
  function burst(x, y, n, color) {
    for (var i = 0; i < n; i++) {
      var b = document.createElement('div');
      b.className = 'bit';
      b.style.left = x + 'px'; b.style.top = y + 'px';
      b.style.background = color || '#fff';
      var ang = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 70;
      b.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      b.style.setProperty('--dy', (Math.sin(ang) * dist - 30) + 'px');
      b.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
      field.appendChild(b);
      (function (el) { setTimeout(function () { el.remove(); }, 750); })(b);
    }
  }
  function doFlash() { flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
  function doShake() { app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); }

  function mult() { return Math.min(3, 1 + Math.floor(combo / 8)); }
  function addScore(n, x, y) {
    score += n;
    scoreEl.textContent = score;
    if (x !== undefined) showPopup(x, y, '+' + n);
  }
  function addCombo() {
    combo++; comboTimer = 1.6;
    if (combo > maxCombo) maxCombo = combo;
    if (combo >= 3) { comboTag.textContent = '🔥 连击 x' + combo + '（' + mult() + '倍分）'; comboTag.classList.remove('hidden'); }
  }
  function resetCombo() { combo = 0; comboTag.classList.add('hidden'); }
  function reduceStress(n) {
    stress = Math.max(0, stress - n);
    stressFill.style.width = stress + '%';
    stressText.textContent = Math.round(stress) + '%';
    if (stress <= 0) {
      stress = 100;
      stressFill.style.width = '100%';
      stressText.textContent = '100%';
      score += 500;
      scoreEl.textContent = score;
      var r = field.getBoundingClientRect();
      showPopup(r.width / 2, r.height / 2 - 40, '😮‍💨 压力清零！+500', 'big');
      playVoice('win');
      sfxDing();
      for (var i = 0; i < 5; i++) burst(Math.random() * r.width, Math.random() * r.height * 0.6 + 40, 6, ['#ffd94d', '#7df9c9', '#ff5aa0', '#fff'][i % 4]);
    }
  }

  function spawnItem() {
    var w = field.clientWidth, h = field.clientHeight;
    if (!w || !h) return;
    var roll = Math.random();
    var el = document.createElement('div');
    el.className = 'item';
    var type, speed;
    if (roll < 0.08) {
      type = 'gold';
      var s = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
      el.innerHTML = '<div class="paper gold"><div class="subj">🌟 金卷</div><div class="lines">' + s.eq.replace(/\n/g, '<br>') + '</div></div>';
      speed = 2.4;
    } else if (roll < 0.16) {
      type = 'monster';
      el.innerHTML = '<div class="face-wrap"><div class="face monster"><img src="img/monster.webp" alt="试卷怪"><span class="hp">×2</span></div><span class="face-tag monster">试卷怪</span></div>';
      speed = 2.0;
      playVoice('monster');
    } else if (roll < 0.28) {
      type = 'teacher';
      el.innerHTML = '<div class="face-wrap"><div class="face"><img src="img/teacher.webp" alt="老师"></div><span class="face-tag">别点我！</span></div>';
      speed = 1.7;
    } else if (roll < 0.34) {
      type = 'bomb';
      el.innerHTML = '<div class="bomb">🧽<span>橡皮擦炸弹</span></div>';
      speed = 2.2;
    } else {
      type = 'paper';
      var s2 = SUBJECTS[Math.floor(Math.random() * SUBJECTS.length)];
      el.innerHTML = '<div class="paper"><div class="subj">' + s2.name + '</div><div class="lines">' + s2.eq.replace(/\n/g, '<br>') + '</div></div>';
      speed = 2.6 + Math.random() * 1.4;
    }
    var itemW = 92;
    var x = 8 + Math.random() * Math.max(1, w - itemW - 16);
    var it = { el: el, type: type, x: x, y: -120, speed: speed, hp: type === 'monster' ? 2 : 1, rot: (Math.random() * 16 - 8), wob: Math.random() * Math.PI * 2 };
    el.style.transform = 'translate(' + x + 'px, -120px) rotate(' + it.rot + 'deg)';
    el.dataset.type = type;
    field.appendChild(el);
    items.push(it);
  }

  function destroyItem(it, x, y, silent) {
    var idx = items.indexOf(it);
    if (idx >= 0) items.splice(idx, 1);
    if (!silent) { burst(x, y, 8, '#fff'); }
    it.el.remove();
  }

  function onTap(e) {
    if (!running || paused) return;
    var t = e.target.closest('.item');
    if (!t) { resetCombo(); return; }
    var it = null;
    for (var i = 0; i < items.length; i++) { if (items[i].el === t) { it = items[i]; break; } }
    if (!it) return;
    var r = field.getBoundingClientRect();
    var x = (e.clientX || r.width / 2) - r.left;
    var y = (e.clientY || 120) - r.top;
    if (it.type === 'paper') {
      var pts = 10 * mult();
      addScore(pts, x, y);
      addCombo(); torn++;
      reduceStress(3);
      sfxRip();
      if (Math.random() < 0.35) playVoice(TEAR_VOICES[Math.floor(Math.random() * 3)]);
      if (Math.random() < 0.3) showPopup(x, y - 34, TAUNTS[Math.floor(Math.random() * TAUNTS.length)]);
      destroyItem(it, x, y);
    } else if (it.type === 'gold') {
      addScore(50 * mult(), x, y);
      addCombo(); torn++;
      reduceStress(6);
      sfxDing();
      burst(x, y, 10, '#ffd94d');
      showPopup(x, y - 34, '金卷！', 'big');
      destroyItem(it, x, y, true);
    } else if (it.type === 'monster') {
      it.hp--;
      if (it.hp > 0) {
        it.el.classList.remove('crack'); void it.el.offsetWidth; it.el.classList.add('crack');
        var hpEl = it.el.querySelector('.hp'); if (hpEl) hpEl.textContent = '×1';
        showPopup(x, y, '哎呀，还差一下！');
        sfxPop();
      } else {
        addScore(30 * mult(), x, y);
        addCombo(); torn++;
        reduceStress(8);
        sfxBoom();
        burst(x, y, 12, '#b06bff');
        showPopup(x, y - 34, '试卷怪粉碎！');
        destroyItem(it, x, y, true);
      }
    } else if (it.type === 'teacher') {
      score = Math.max(0, score - 20);
      scoreEl.textContent = score;
      resetCombo();
      sfxBad();
      playVoice('ouch');
      doShake();
      showPopup(x, y, '被老师抓到了！-20', 'bad');
      destroyItem(it, x, y);
    } else if (it.type === 'bomb') {
      playVoice('bomb');
      sfxBoom();
      doFlash();
      var gained = 0;
      var copy = items.slice();
      for (var j = 0; j < copy.length; j++) {
        var o = copy[j];
        if (o === it) continue;
        var r2 = o.el.getBoundingClientRect();
        burst(r2.left - r.left + 40, r2.top - r.top + 40, 5, '#ff9ecf');
        gained += 5;
        destroyItem(o, 0, 0, true);
      }
      if (gained > 0) { addScore(gained, x, y); torn += Math.floor(gained / 5); }
      reduceStress(10);
      destroyItem(it, x, y, true);
    }
  }
  field.addEventListener('pointerdown', onTap);

  function loop(ts) {
    if (!running) return;
    var dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
    lastTs = ts;
    if (!paused) {
      timeLeft -= dt;
      var t = Math.max(0, Math.ceil(timeLeft));
      timeEl.textContent = t;
      timeBox.classList.toggle('low', timeLeft <= 10);
      if (timeLeft <= 0) { endGame(); return; }
      comboTimer -= dt;
      if (comboTimer <= 0 && combo > 0) resetCombo();
      var progress = 1 - timeLeft / 60;
      var interval = 0.75 - progress * 0.38;
      spawnAcc += dt;
      if (spawnAcc >= interval) { spawnAcc = 0; spawnItem(); if (Math.random() < 0.25) spawnItem(); }
      var h = field.clientHeight;
      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        it.y += it.speed * dt * 100;
        it.wob += dt * 2;
        var wx = it.x + Math.sin(it.wob) * 8;
        it.el.style.transform = 'translate(' + wx + 'px, ' + it.y + 'px) rotate(' + it.rot + 'deg)';
        if (it.y > h + 130) { it.el.remove(); items.splice(i, 1); }
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    score = 0; combo = 0; maxCombo = 0; torn = 0; stress = 100; timeLeft = 60;
    spawnAcc = 0; comboTimer = 0;
    scoreEl.textContent = '0'; timeEl.textContent = '60';
    stressFill.style.width = '100%'; stressText.textContent = '100%';
    timeBox.classList.remove('low');
    comboTag.classList.add('hidden');
    field.querySelectorAll('.item,.popup,.bit').forEach(function (el) { el.remove(); });
    items = [];
    ac();
    playVoice('start');
    running = true; paused = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    lastTs = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(rafId);
    items.forEach(function (it) { it.el.remove(); });
    items = [];
    var best = 0;
    try { best = parseInt(localStorage.getItem('hw_best') || '0', 10) || 0; } catch (e) {}
    var isNewBest = score > best;
    if (isNewBest) { best = score; try { localStorage.setItem('hw_best', String(best)); } catch (e) {} }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('statTorn').textContent = torn;
    document.getElementById('statCombo').textContent = maxCombo;
    document.getElementById('statBest').textContent = best;
    var rank, line;
    if (score >= 1000) { rank = '👑 解压之王'; line = '作业在你面前就是纸老虎！60 秒撕出 ' + torn + ' 张，这气撒得漂亮。'; }
    else if (score >= 600) { rank = '💪 作业终结者'; line = '撕了 ' + torn + ' 张作业，压力条都给你干见底了，牛！'; }
    else if (score >= 300) { rank = '✂️ 撕纸能手'; line = '撕了 ' + torn + ' 张，手速还可以，再练练就能当终结者。'; }
    else { rank = '🐣 作业小白'; line = '才撕 ' + torn + ' 张？老师都替你着急，再来一局出出气！'; }
    if (isNewBest && score > 0) rank += ' · 新纪录！';
    document.getElementById('rankTitle').textContent = rank;
    document.getElementById('endLine').textContent = line;
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  document.getElementById('soundBtn').addEventListener('click', function () {
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔊' : '🔇';
  });
  document.getElementById('pauseBtn').addEventListener('click', function () {
    if (!running) return;
    paused = true;
    document.getElementById('pauseOverlay').classList.remove('hidden');
  });
  document.getElementById('resumeBtn').addEventListener('click', function () {
    paused = false;
    document.getElementById('pauseOverlay').classList.add('hidden');
    lastTs = performance.now();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && running && !paused) document.getElementById('pauseBtn').click();
  });

  var best = 0;
  try { best = parseInt(localStorage.getItem('hw_best') || '0', 10) || 0; } catch (e) {}
  document.getElementById('bestLine').textContent = '最高分：' + best;
})();
</script>
</body>
</html>
